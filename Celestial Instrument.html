<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Celestial Instrument</title>
<style>
:root{color-scheme:dark;--bg:#05060b;--fg:#e9e3d2;--dim:#8b889a;--gold:#c9a45c;--line:rgba(255,255,255,.14);--red:#d0634a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,"Iowan Old Style","Times New Roman",serif}
main{max-width:560px;margin:0 auto;padding:12px 12px 28px}
h1{font-size:19px;font-weight:400;letter-spacing:.04em;margin:4px 0 8px;color:var(--gold)}
canvas{width:100%;display:block;touch-action:none;border-radius:8px;background:#000}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
button,select,input{font:inherit;font-size:14px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 10px}
#date{color:var(--dim);font-size:14px;margin-left:auto}
.hint{color:var(--dim);font-size:12px;margin:6px 0 0}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
td{padding:5px 2px;border-bottom:1px solid var(--line)}
td:first-child{width:1.6em;color:var(--gold);font-size:16px}
td:last-child{text-align:right;color:var(--red)}
#asp{font-size:13px;color:var(--dim);line-height:1.7;margin-top:10px;min-height:5em}
</style></head><body><main>
<h1>Celestial Instrument</h1>
<canvas id="c"></canvas>
<p class="hint">Drag to rotate · pinch or scroll to zoom · space pauses. The ring shows heliocentric positions; the table below is geocentric, as read from Earth.</p>
<div class="row"><select id="sp"><option value="0">Paused</option><option value="1">1 day / s</option><option value="7" selected>1 week / s</option><option value="30">1 month / s</option><option value="182">6 months / s</option><option value="1826">5 years / s</option></select><input type="date" id="di"><button id="now">Now</button><span id="date"></span></div>
<table id="tb"></table><div id="asp"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const R=Math.PI/180,N=['Mercury','Venus','Earth','Mars','Jupiter','Saturn'],$=id=>document.getElementById(id),clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const E=[[.38709927,.20563593,7.00497902,252.2503235,77.45779628,48.33076593,.00000037,.00001906,-.00594749,149472.67411175,.16047689,-.12534081],
[.72333566,.00677672,3.39467605,181.9790995,131.60246718,76.67984255,.0000039,-.00004107,-.0007889,58517.81538729,.00268329,-.27769418],
[1.00000261,.01671123,-.00001531,100.46457166,102.93768193,0,.00000562,-.00004392,-.01294668,35999.37244981,.32327364,0],
[1.52371034,.0933941,1.84969142,-4.55343205,-23.94362959,49.55953891,.00001847,.00007882,-.00813131,19140.30268499,.44441088,-.29257343],
[5.202887,.04838624,1.30439695,34.39644051,14.72847983,100.47390909,-.00011607,-.00013253,-.00183714,3034.74612775,.21252668,.20469106],
[9.53667594,.05386179,2.48599187,49.95424423,92.59887831,113.66242448,-.0012506,-.00050991,.00193609,1222.49362201,-.41897216,-.28867794]];
const GL={Sun:'☉',Mercury:'☿',Venus:'♀',Earth:'⊕',Mars:'♂',Jupiter:'♃',Saturn:'♄'};
const COL={Sun:'#ffd36b',Mercury:'#a8a8b6',Venus:'#e6d3a3',Earth:'#5aa9c9',Mars:'#d0634a',Jupiter:'#c9a47c',Saturn:'#d8bd6a'};
const SG=['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'];
function H(n,jd){const T=(jd-2451545)/36525,e=E[N.indexOf(n)],a=e[0]+e[6]*T,ec=e[1]+e[7]*T,I=(e[2]+e[8]*T)*R,w=e[4]+e[10]*T,Om=e[5]+e[11]*T;
let M=(((e[3]+e[9]*T-w)%360)+540)%360-180;M*=R;let k=M+ec*Math.sin(M);for(let i=0;i<8;i++)k-=(k-ec*Math.sin(k)-M)/(1-ec*Math.cos(k));
const xp=a*(Math.cos(k)-ec),yp=a*Math.sqrt(1-ec*ec)*Math.sin(k),o=(w-Om)*R,O=Om*R,co=Math.cos(o),so=Math.sin(o),cO=Math.cos(O),sO=Math.sin(O),cI=Math.cos(I);
let x=(co*cO-so*sO*cI)*xp+(-so*cO-co*sO*cI)*yp,y=(co*sO+so*cO*cI)*xp+(-so*sO+co*cO*cI)*yp,p=1.3969*T*R;
return[x*Math.cos(p)-y*Math.sin(p),x*Math.sin(p)+y*Math.cos(p)]}
const V=(n,jd,m)=>{if(m=='S')return n=='Sun'?[0,0]:H(n,jd);const e=H('Earth',jd);if(n=='Sun')return[-e[0],-e[1]];const p=H(n,jd);return[p[0]-e[0],p[1]-e[1]]};
const L=v=>((Math.atan2(v[1],v[0])/R)%360+360)%360;
/* ---------- scene ---------- */
const cv=$('c'),ren=new THREE.WebGLRenderer({canvas:cv,antialias:true}),sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(42,1,.1,300);
let th=-.5,ph=1.05,dist=27,seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const S=3,Ri=11.2,Ro=12.6;
function tex(fn){const c=document.createElement('canvas');c.width=512;c.height=256;const x=c.getContext('2d');fn(x,512,256);return new THREE.CanvasTexture(c)}
const bands=(cols,spots)=>tex((x,w,h)=>{let y=0;while(y<h){const t=4+rnd()*26;x.fillStyle=cols[Math.floor(rnd()*cols.length)];x.fillRect(0,y,w,t);y+=t}for(let i=0;i<260;i++){x.fillStyle='rgba('+(rnd()>.5?'255,240,210':'60,40,20')+',.07)';x.beginPath();x.ellipse(rnd()*w,rnd()*h,10+rnd()*40,2+rnd()*5,0,0,7);x.fill()}if(spots){x.fillStyle='rgba(170,70,40,.75)';x.beginPath();x.ellipse(340,170,24,13,0,0,7);x.fill()}});
const blot=(base,cols,n,r,craters)=>tex((x,w,h)=>{x.fillStyle=base;x.fillRect(0,0,w,h);for(let i=0;i<n;i++){x.fillStyle=cols[Math.floor(rnd()*cols.length)];x.globalAlpha=.35+rnd()*.4;x.beginPath();x.ellipse(rnd()*w,rnd()*h,r*(.4+rnd()),r*(.3+rnd()*.7),rnd()*3,0,7);x.fill()}x.globalAlpha=1;if(craters)for(let i=0;i<90;i++){const cx=rnd()*w,cy=rnd()*h,rr=2+rnd()*8;x.strokeStyle='rgba(30,30,35,.5)';x.fillStyle='rgba(20,20,25,.18)';x.beginPath();x.arc(cx,cy,rr,0,7);x.fill();x.stroke()}});
const earthTex=blot('#245f9e',['#4f8a46','#6e9a52','#b7a773','#2d73b3'],120,34);
const TX={Mercury:blot('#8d8b8a',['#6e6c6b','#a6a3a0'],80,18,1),Venus:blot('#d9bf8a',['#ecd9a6','#c9a76a','#f0e2bd'],90,40),Earth:earthTex,
Mars:blot('#b5532f',['#8c3a21','#cf7a4d','#6d2f1d'],90,26,1),Jupiter:bands(['#d6b48a','#b98b62','#e8d4b0','#9d6b45','#cda27a'],1),Saturn:bands(['#dcc78d','#c9b077','#e8d9a8','#b89c62'])};
const RAD={Mercury:.26,Venus:.4,Earth:.42,Mars:.32,Jupiter:.85,Saturn:.7};
function glowTex(){return tex((x,w,h)=>{const g=x.createRadialGradient(256,128,0,256,128,128);g.addColorStop(0,'rgba(255,230,160,1)');g.addColorStop(.25,'rgba(255,190,90,.5)');g.addColorStop(1,'rgba(255,150,40,0)');x.fillStyle=g;x.fillRect(0,0,w,h)})}
function label(t,sz,col,dt){const c=document.createElement('canvas');c.width=512;c.height=128;const x=c.getContext('2d');x.font='64px Georgia,serif';x.fillStyle=col;x.textAlign='center';x.textBaseline='middle';x.fillText(t,256,64);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:!dt,depthWrite:false}));s.scale.set(sz*4,sz,1);return s}
sc.add(new THREE.AmbientLight(0x3a4058,.9));sc.add(new THREE.PointLight(0xfff0d0,1.7,0,0));
const sun=new THREE.Mesh(new THREE.SphereGeometry(.95,32,32),new THREE.MeshBasicMaterial({color:0xffe6a6}));sc.add(sun);
const gl=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex(),blending:THREE.AdditiveBlending,transparent:true,depthWrite:false}));gl.scale.set(7,7,1);sc.add(gl);
const st=new Float32Array(2400);for(let i=0;i<800;i++){const a=rnd()*6.28,b=Math.acos(2*rnd()-1),r=90+rnd()*60;st[i*3]=r*Math.sin(b)*Math.cos(a);st[i*3+1]=r*Math.cos(b);st[i*3+2]=r*Math.sin(b)*Math.sin(a)}
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(st,3));sc.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xbfc6e0,size:.45,sizeAttenuation:true})));
const circ=(r,col,op)=>{const p=[];for(let i=0;i<=128;i++)p.push(new THREE.Vector3(r*Math.cos(i/128*6.2832),0,-r*Math.sin(i/128*6.2832)));return new THREE.Line(new THREE.BufferGeometry().setFromPoints(p),new THREE.LineBasicMaterial({color:col,transparent:true,opacity:op}))};
N.forEach((n,i)=>sc.add(circ(Math.sqrt(E[i][0])*S,0xb9b2a0,.22)));sc.add(circ(Ri,0xc9a45c,.55),circ(Ro,0xc9a45c,.55));
const sec=[];for(let i=0;i<12;i++){const g=new THREE.RingGeometry(Ri,Ro,24,1,i*30*R,30*R);g.rotateX(-Math.PI/2);const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0xc9a45c,transparent:true,opacity:i%2?.05:.1,side:THREE.DoubleSide,depthWrite:false}));m.userData.b=i%2?.05:.1;sc.add(m);sec.push(m);
const a=i*30*R,ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(Ri*Math.cos(a),0,-Ri*Math.sin(a)),new THREE.Vector3(Ro*Math.cos(a),0,-Ro*Math.sin(a))]),new THREE.LineBasicMaterial({color:0xc9a45c,transparent:true,opacity:.6}));sc.add(ln);
const lb=label(SG[i],.75,'#e9dcb8');const m2=(i*30+15)*R,rm=(Ri+Ro)/2;lb.position.set(rm*Math.cos(m2),0,-rm*Math.sin(m2));sc.add(lb)}
const PL={};N.forEach(n=>{const g=new THREE.Group(),m=new THREE.Mesh(new THREE.SphereGeometry(RAD[n],40,40),new THREE.MeshStandardMaterial({map:TX[n],roughness:.95,metalness:0}));g.add(m);g.userData.m=m;
if(n=='Saturn'){const rg=new THREE.RingGeometry(1,1.75,64);rg.rotateX(-Math.PI/2);const r=new THREE.Mesh(rg,new THREE.MeshBasicMaterial({color:0xcdb98a,transparent:true,opacity:.55,side:THREE.DoubleSide,depthWrite:false}));r.rotation.z=.42;g.add(r)}
if(n=='Earth'){const rg=new THREE.RingGeometry(.62,.68,48);rg.rotateX(-Math.PI/2);g.add(new THREE.Mesh(rg,new THREE.MeshBasicMaterial({color:0x9fd6e8,transparent:true,opacity:.8,side:THREE.DoubleSide})))}
const lb=label(n,.55,'#d8d2c2',1);lb.position.y=RAD[n]+.7;g.add(lb);sc.add(g);PL[n]=g;
const d=new THREE.Mesh(new THREE.SphereGeometry(.09,10,10),new THREE.MeshBasicMaterial({color:COL[n]}));sc.add(d);g.userData.d=d});
const pos2=(lon,r,y=0)=>new THREE.Vector3(r*Math.cos(lon*R),y,-r*Math.sin(lon*R));
const sl=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3(),new THREE.Vector3()]),new THREE.LineBasicMaterial({color:0xd0634a}));sc.add(sl);
const sd=new THREE.Mesh(new THREE.SphereGeometry(.22,14,14),new THREE.MeshBasicMaterial({color:0xe0674a}));sc.add(sd);
const sdl=label('Sun as seen from Earth',.5,'#e8a090',1);sc.add(sdl);
/* ---------- camera + input ---------- */
function setCam(){cam.position.set(dist*Math.sin(ph)*Math.sin(th),dist*Math.cos(ph),dist*Math.sin(ph)*Math.cos(th));cam.lookAt(0,0,0)}
function size(){const W=cv.parentElement.clientWidth-24,Hh=Math.round(W*1.0);ren.setPixelRatio(Math.min(devicePixelRatio||1,2));ren.setSize(W,Hh,false);cam.aspect=W/Hh;cam.updateProjectionMatrix()}
size();addEventListener('resize',size);
const pts=new Map();let pd=0;
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY])};
cv.onpointermove=e=>{if(!pts.has(e.pointerId))return;const o=pts.get(e.pointerId);if(pts.size==1){th-=(e.clientX-o[0])*.008;ph=clamp(ph-(e.clientY-o[1])*.006,.12,1.5)}
pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size==2){const a=[...pts.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pd)dist=clamp(dist*pd/d,7,70);pd=d}};
cv.onpointerup=cv.onpointercancel=e=>{pts.delete(e.pointerId);pd=0};
cv.addEventListener('wheel',e=>{e.preventDefault();dist=clamp(dist*(1+e.deltaY*.001),7,70)},{passive:false});
/* ---------- time + readout ---------- */
let jd=Date.now()/864e5+2440587.5,speed=7,saved=7;
$('sp').onchange=e=>speed=+e.target.value;$('now').onclick=()=>jd=Date.now()/864e5+2440587.5;
$('di').onchange=e=>{const t=Date.parse(e.target.value+'T12:00:00Z');if(!isNaN(t))jd=t/864e5+2440587.5};
addEventListener('keydown',e=>{if(e.code=='Space'&&e.target.tagName!='INPUT'){e.preventDefault();if(speed){saved=speed;speed=0}else speed=saved||7;$('sp').value=String(speed)}});
const fmt=l=>{const g=Math.floor(l%30),m=Math.floor((l%30-g)*60);return g+'°'+String(m).padStart(2,'0')+'′ '+SG[Math.floor(l/30)]};
const GN=['Sun','Mercury','Venus','Mars','Jupiter','Saturn'],AS=[[0,'conjunct'],[60,'sextile'],[90,'square'],[120,'trine'],[180,'opposite']];
function readout(){const B=GN.map(n=>{const lon=L(V(n,jd,'E'));let d=L(V(n,jd+.5,'E'))-L(V(n,jd-.5,'E'));if(d>180)d-=360;if(d<-180)d+=360;return{n,lon,rx:d<0}});
$('tb').innerHTML=B.map(b=>'<tr><td>'+GL[b.n]+'</td><td>'+b.n+'</td><td>'+fmt(b.lon)+'</td><td>'+(b.rx?'℞':'')+'</td></tr>').join('');
const o=[];for(let i=0;i<B.length;i++)for(let j=i+1;j<B.length;j++){let d=Math.abs(B[i].lon-B[j].lon);if(d>180)d=360-d;for(const a of AS){const orb=Math.abs(d-a[0]);if(orb<=5)o.push([orb,B[i].n+' '+a[1]+' '+B[j].n+' · orb '+orb.toFixed(1)+'°'])}}
$('asp').innerHTML=o.sort((a,b)=>a[0]-b[0]).slice(0,6).map(x=>x[1]).join('<br>')||'No aspects within 5°';
$('date').textContent=new Date((jd-2440587.5)*864e5).toISOString().slice(0,10);return B[0].lon}
let last=performance.now(),acc=1;
function tick(t){const dt=Math.min((t-last)/1e3,.1);last=t;jd+=speed*dt;
N.forEach(n=>{const v=V(n,jd,'S'),r=Math.hypot(v[0],v[1]),lon=L(v),g=PL[n];g.position.copy(pos2(lon,Math.sqrt(r)*S));g.userData.m.rotation.y+=.012;const d=g.userData.d;d.position.copy(pos2(lon,Ri));g.userData.m.rotation.z=0});
const ev=V('Earth',jd,'S'),el=L(ev),sl0=(el+180)%360,ep=PL.Earth.position,rp=pos2(sl0,Ri);
sl.geometry.setFromPoints([ep,new THREE.Vector3(),rp]);sd.position.copy(rp);sdl.position.copy(pos2(sl0,Ro+1.2,.2));
const si=Math.floor(sl0/30);sec.forEach((m,i)=>m.material.opacity=i==si?.4:m.userData.b);
gl.material.opacity=.95;setCam();ren.render(sc,cam);
acc+=dt;if(acc>.12){acc=0;readout()}requestAnimationFrame(tick)}
requestAnimationFrame(tick);
</script></body></html>
