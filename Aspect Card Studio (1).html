<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aspect Card Studio</title>
<style>
:root{--bg:#f3f1f7;--fg:#1b1830;--pn:#fff;--bd:#d9d4ea;--ac:#7b5cff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0b1a;--fg:#ece8ff;--pn:#171430;--bd:#2c2757}}
:root[data-theme="dark"]{--bg:#0d0b1a;--fg:#ece8ff;--pn:#171430;--bd:#2c2757}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{display:grid;gap:14px;padding:14px;max-width:1100px;margin:auto;grid-template-columns:minmax(0,1fr)}
@media(min-width:860px){.wrap{grid-template-columns:370px minmax(0,1fr)}}
.pn{background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:12px;display:grid;gap:10px}
h3{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.65}
.tabs,.row,.sw{display:flex;gap:6px;flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:8px 10px}
button{cursor:pointer}button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.tabs button{flex:1}
select{flex:1;min-width:0}textarea,input[type=text],input[type=date]{width:100%;box-sizing:border-box}
#cust{display:none}.sw button{width:38px;height:38px;padding:0}
#rec{background:#ff4d6d;border-color:#ff4d6d;color:#fff;font-weight:600}
.pv{display:grid;justify-items:center;gap:10px}
canvas{width:100%;max-width:420px;aspect-ratio:9/16;border-radius:14px;touch-action:none;background:#000}
video{width:100%;max-width:420px;border-radius:12px;display:none}
small{opacity:.65}
</style></head><body>

<div style="display:grid;gap:14px;align-content:start">

  <div class="tabs" id="tabs"><button data-m="daily" class="on">Daily</button><button data-m="weekly">Weekly</button><button data-m="custom">My aspects</button></div>
  <input type="date" id="date"><input type="text" id="head" placeholder="Headline (optional)">
  <div id="cust"></div>
 </div>
 <div class="pn"><h3>Style</h3><div class="tabs" id="sty"></div></div>
 <div class="pn"><h3>Background</h3>
  <input type="file" id="file" accept="image/*">
  <div class="sw" id="sw"></div>
  <label>Dim <input type="range" id="dim" min="0" max="80" value="30"></label>
 </div>
 <div class="pn"><h3>Export</h3>
  <div class="row"><select id="dur"><option value="8">8 s loop</option><option value="16">16 s loop</option></select><button id="rec">● Record video</button></div>
  <small id="st">Records the 9:16 preview exactly as you see it.</small>
  <video id="vid" controls playsinline></video><a id="dl" style="display:none" download>Download</a>
 </div>
</div>
<div class="pv"><canvas id="cv" width="1080" height="1920"></canvas><small>Drag the card to tilt it · positions are approximate (≈1°)</small></div>
</div>
