const pages=[{"name":"Fib Journeys — Example Library.html","title":"Fib Journeys — Example Library","html":"<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Fib Journeys — Example Library</title>\n<style>\n:root{--bg:#f6f4ef;--sf:#fff;--tx:#1d1b18;--mu:#6b665d;--ln:#ddd8cc;--ac:#8a5a00;--ok:#1f7a3d;--bad:#b3261e;--up:#3b5bdb;--dn:#e03131;--fl:#7b93a0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#131210;--sf:#1b1a17;--tx:#ece8de;--mu:#9a958a;--ln:#33302a;--ac:#e0a93b;--ok:#5fcf86;--bad:#ff7b72;--up:#6f8cff;--dn:#ff6b6b;--fl:#7f9aa8;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg:#131210;--sf:#1b1a17;--tx:#ece8de;--mu:#9a958a;--ln:#33302a;--ac:#e0a93b;--ok:#5fcf86;--bad:#ff7b72;--up:#6f8cff;--dn:#ff6b6b;--fl:#7f9aa8;color-scheme:dark}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Georgia,serif}\nmain{max-width:1000px;margin:0 auto;padding:16px 12px 50px}\nh1{font-size:22px;margin:6px 0 2px}h2{font-size:16px;margin:0 0 6px;color:var(--ac)}.sub{color:var(--mu);margin:0 0 12px;font-size:14px}\n.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:12px}\n.grp{font:12px system-ui,sans-serif;color:var(--mu);margin:8px 0 4px}.chips{display:flex;gap:6px;flex-wrap:wrap}\nbutton,.chip{padding:7px 11px;border:1px solid var(--ac);background:var(--ac);color:var(--bg);border-radius:6px;font:600 13px system-ui,sans-serif;cursor:pointer}\nbutton.g{background:transparent;color:var(--tx);border-color:var(--ln)}button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}\n.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font:13px system-ui,sans-serif}\nselect,textarea{padding:6px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--tx);font:13px system-ui,sans-serif}\ntextarea{width:100%;height:70px;font-family:ui-monospace,monospace}\ncanvas{width:100%;height:430px;display:block}input[type=range]{accent-color:var(--ac)}\n.steps{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}\n.hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:8px;font-family:system-ui,sans-serif}\n.k{border:1px solid var(--ln);border-radius:8px;padding:5px 8px}.k small{display:block;font-size:11px;color:var(--mu)}.k b{font-size:15px}\ntable{width:100%;border-collapse:collapse;font:13px system-ui,sans-serif}th,td{text-align:left;padding:5px 4px;border-bottom:1px solid var(--ln)}\n.pos{color:var(--ok)}.neg{color:var(--bad)}\n.warn{border-left:4px solid var(--bad);padding:8px 12px;font:13px/1.5 system-ui,sans-serif;background:var(--sf);border-radius:0 8px 8px 0;margin-bottom:12px}\n.cap{font:12px system-ui,sans-serif;color:var(--mu)}.scroll{overflow-x:auto}\n@media(max-width:560px){canvas{height:340px}}\n</style></head><body><main>\n<h1>Fib Journeys — example library</h1>\n<p class=\"sub\">Fourteen paths through your ladder, each replayed with the same rule-based trades. Pick one, mirror it, or paste your own BOS rows.</p>\n<div class=\"warn\"><b>These examples are constructed, not recorded.</b> I built them from the staircase regularity in your 21 rows (pullback lands one step under the peak, next peak clears the last). They show how the plan behaves across regimes; they are not evidence of how often each regime occurs. The scorecard below measures mechanics, and any edge it shows is partly baked into how I wrote the paths. Paste real rows, failures included, to test the plan itself.</div>\n<div class=\"card\" id=\"lib\"></div>\n<div class=\"card\"><canvas id=\"cv\"></canvas>\n<div class=\"ctl\" style=\"margin-top:8px\"><button id=\"pl\">Play</button><button class=\"g\" id=\"bk\">◀ Step</button><button class=\"g\" id=\"nx\">Step ▶</button><button class=\"g\" id=\"rs\">Restart</button>\n<label>Speed <input id=\"sp\" type=\"range\" min=\"1\" max=\"6\" value=\"3\"></label><label><input id=\"ap\" type=\"checkbox\" checked> Pause at each step</label></div>\n<input id=\"sc\" type=\"range\" min=\"0\" value=\"0\" style=\"width:100%;margin-top:6px\"><div class=\"steps\" id=\"st\"></div></div>\n<div class=\"card\"><h2 id=\"nt\"></h2><div id=\"nb\"></div>\n<div class=\"hud\"><div class=\"k\"><small>Open trades</small><b id=\"h1\">0</b></div><div class=\"k\"><small>Closed</small><b id=\"h2\">0</b></div><div class=\"k\"><small>Realized</small><b id=\"h3\">0R</b></div></div></div>\n<div class=\"card\"><h2>Scorecard — all examples, current rules</h2><div class=\"scroll\"><table><thead><tr><th>Example</th><th>Dir</th><th>Trades</th><th>Wins</th><th>Net R</th></tr></thead><tbody id=\"sb\"></tbody></table></div>\n<p class=\"cap\" id=\"tot\"></p></div>\n<div class=\"card\"><h2>Your rows</h2><textarea id=\"ta\" placeholder=\"BOS 0-100&#9;1.5&#9;3.14&#9;2&#9;1.38 ...\"></textarea>\n<div class=\"ctl\" style=\"margin-top:6px\"><button id=\"ld\">Add rows to library</button><span class=\"cap\">One row per line, same format as your list. Odd positions are peaks, even positions pullbacks. Include BOS events that failed.</span></div></div>\n<p class=\"cap\">Rules: enter a limit at each pullback at 1.00 or deeper, SL on the highest ladder level at least the chosen distance below entry, TP on the first ladder level that gives the chosen R:R or better. Stop is checked before target within a candle. Bearish journeys are mirrored: the same ladder measured downward, and entries are shorts.</p>\n</main>\n<script>\nconst $=id=>document.getElementById(id);\nconst LV=[0,.5,.62,1,1.27,1.38,1.5,1.61,1.88,2,2.36,2.61,2.88,3.14,3.61,3.82,4.23,4.88,5.6,6.18,6.84,7.85,9.44];\nconst LIB=[\n['Bullish to 6.18','B1',1,[1.61,1.27,2.61,1.61,3.14,2.61,4.88,4.23,5.6,4.23,6.18],'Classic staircase: eleven points, five pullbacks.'],\n['Bullish to 6.18','B2',1,[2,1.27,3.14,2.36,4.23,3.14,5.6,4.23,6.18],'Deep first pullback, then clean steps.'],\n['Bullish to 6.18','B3',1,[1.88,1,2.61,1.61,3.82,2.61,4.88,3.82,6.18],'Pullbacks land on 1.0, 1.61, 2.61, 3.82.'],\n['Bullish to 6.18','B4',1,[2.36,1.61,3.14,2.36,4.88,3.82,5.6,4.88,6.18],'Shallow pullbacks late in the move.'],\n['Bullish to 6.18','B5',1,[1.5,.62,2.61,1.38,3.82,2.88,4.88,4.23,6.18],'Starts with a pullback back to 0.62.'],\n['Bearish to 6.18','D1',-1,[1.61,.62,2.61,1.27,3.14,2.36,4.23,3.14,5.6,4.88,6.18],'Bearish staircase, mirrored ladder.'],\n['Bearish to 6.18','D2',-1,[2.61,1.61,3.82,2.61,4.88,3.61,5.6,4.23,6.18],'Fast first leg, orderly continuation.'],\n['Bearish to 6.18','D3',-1,[1.27,.5,2,1,3.14,2,4.23,3.14,6.18],'Slow start, late acceleration.'],\n['Bearish to 6.18','D4',-1,[1.88,1.27,2.88,1.88,3.82,3.14,5.6,4.88,6.18],'Mixed depth pullbacks.'],\n['Bearish to 6.18','D5',-1,[3.14,1.61,3.82,2.61,4.88,4.23,5.6,4.23,6.18],'Big opening leg to 3.14, then steps.'],\n['Other regimes','Pullback mode: stalls at 3.14',1,[1.61,1.27,2.61,1.61,3.14,2,2.88,1.88],'Tags 3.14, fails to continue, and the pullbacks go deeper than the staircase allows.'],\n['Other regimes','Extension: runs to 9.44',1,[1.61,1.27,2.61,1.61,3.82,2.61,4.88,4.23,6.18,4.88,7.85,6.18,9.44],'Passes 6.18 and keeps stepping.'],\n['Other regimes','Range: caps at 3.82',1,[1.61,1,2.36,1.27,3.14,1.61,3.82,1.88,3.61,1.61,3.82,1.88],'Peaks stall between 3.14 and 3.82 while pullbacks keep returning to 1.6–1.9.'],\n['Other regimes','Fast trend to 6.18',1,[3.14,2,4.23,3.14,5.6,4.88,6.18],'Shallow pullbacks: fewer entries, less time to fill.']];\nlet CUS=[],sel=0,mir=false,minRisk=.35,rrMin=2;\nconst all=()=>LIB.concat(CUS);\nfunction rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}\nconst fx=(v,d=2)=>(+v).toFixed(d);\nfunction sim(ex,seed){\n const s=ex[3],r=rng(seed),KP=[[0,.9]];let t=0,prev=.9;const pt=[];\n s.forEach((v,i)=>{const pk=i%2===0,g=pk?v+.03:v-.05;t+=Math.max(5,Math.round(Math.abs(g-prev)*6));KP.push([t,g]);pt.push(t);prev=g});\n KP.push([t+4,prev]);const N=t+5;\n const tg=i=>{for(let k=0;k<KP.length-1;k++){const a=KP[k],b=KP[k+1];if(i>=a[0]&&i<=b[0])return b[0]===a[0]?b[1]:a[1]+(b[1]-a[1])*(i-a[0])/(b[0]-a[0])}return prev};\n const C=[];let nz=0;for(let i=0;i<N;i++){const q=tg(i),sg=.04+.02*q;nz=.4*nz+(r()-.5)*2.4*sg;const c=Math.max(.2,q+nz),o=i?C[i-1].c:q;C.push({o,c,h:Math.max(o,c)+r()*sg*.8,l:Math.min(o,c)-r()*sg*.8})}\n const T=[];\n s.forEach((pl,i)=>{if(i%2===0||pl<1||pl>=s[i-1])return;\n  const sls=LV.filter(l=>l<=pl-minRisk);if(!sls.length)return;const sl=sls[sls.length-1],risk=pl-sl;\n  const tps=LV.filter(l=>l>=pl+rrMin*risk);if(!tps.length)return;const tp=tps[0],rr=(tp-pl)/risk;\n  let fi=-1;for(let j=pt[i-1];j<N;j++)if(C[j].l<=pl){fi=j;break}if(fi<0)return;\n  let exi=N-1,res=null;for(let j=fi;j<N;j++){if(C[j].l<=sl){exi=j;res=-1;break}if(j>fi&&C[j].h>=tp){exi=j;res=rr;break}}\n  const open=res===null;if(open)res=(C[N-1].c-pl)/risk;\n  T.push({n:T.length+1,pl,sl,tp,rr,fi,ex:exi,res,open})});\n return{C,N,T,mx:Math.max(...s)+.5};\n}\nlet S,D=1,STEPS=[],cur=0,timer=null;\nfunction load(i){pause();sel=i;const ex=all()[i];D=ex[2]*(mir?-1:1);S=sim(ex,40+i);cur=0;\n STEPS=[[0,ex[1]+' · '+(D>0?'bullish ▲':'bearish ▼'),ex[4]+' Entries are '+(D>0?'long':'short')+' limits at each pullback. Path peaks: '+ex[3].filter((_,k)=>k%2===0).join(', ')+'.']];\n S.T.forEach(t=>{STEPS.push([t.fi,'T'+t.n+' · '+(D>0?'long':'short')+' limit filled at '+fx(t.pl),'SL '+fx(t.sl)+', TP '+fx(t.tp)+'. Risk '+fx(t.pl-t.sl)+', reward '+fx(t.tp-t.pl)+', <b>R:R 1:'+fx(t.rr,1)+'</b>.']);\n  STEPS.push([t.ex,'T'+t.n+(t.res<0?' · stopped out':t.open?' · still open':' · target hit'),t.res<0?'Price lost '+fx(t.sl)+' first. −1R.':t.open?'Unresolved at the end of the path: '+(t.res>=0?'+':'')+fx(t.res,1)+'R on paper.':'TP '+fx(t.tp)+' reached. +'+fx(t.rr,1)+'R.'])});\n STEPS.sort((a,b)=>a[0]-b[0]);\n $('st').innerHTML='';STEPS.forEach((s,k)=>{const b=document.createElement('button');b.textContent=k+1;b.onclick=()=>{pause();cur=s[0];ui()};$('st').appendChild(b)});\n $('sc').max=S.N-1;libUI();score();ui()}\nfunction libUI(){let h='',g='';all().forEach((e,i)=>{if(e[0]!==g){g=e[0];h+=(i?'</div>':'')+'<div class=\"grp\">'+g+'</div><div class=\"chips\">'}h+=`<button class=\"${i===sel?'on':'g'}\" onclick=\"load(${i})\">${e[1]}</button>`});\n h+='</div><div class=\"ctl\" style=\"margin-top:10px\"><label><input type=\"checkbox\" id=\"mr\" '+(mir?'checked':'')+'> Mirror direction</label><label>Min SL distance <select id=\"mrk\">'+[.25,.35,.5,.75].map(v=>`<option ${v===minRisk?'selected':''}>${v}</option>`).join('')+'</select></label><label>Min R:R <select id=\"rrm\">'+[2,2.5,3].map(v=>`<option ${v===rrMin?'selected':''}>${v}</option>`).join('')+'</select></label></div>';\n $('lib').innerHTML=h;$('mr').onchange=e=>{mir=e.target.checked;load(sel)};$('mrk').onchange=e=>{minRisk=+e.target.value;load(sel)};$('rrm').onchange=e=>{rrMin=+e.target.value;load(sel)}}\nfunction score(){let tR=0,tn=0,tw=0;\n $('sb').innerHTML=all().map((e,i)=>{const z=sim(e,40+i),cl=z.T.filter(t=>!t.open),w=cl.filter(t=>t.res>0).length,R=z.T.reduce((a,t)=>a+t.res,0);tR+=R;tn+=z.T.length;tw+=w;\n return `<tr><td>${e[1]}</td><td>${e[2]*(mir?-1:1)>0?'▲':'▼'}</td><td>${z.T.length}</td><td>${w}</td><td class=\"${R>=0?'pos':'neg'}\">${R>=0?'+':''}${fx(R,1)}R</td></tr>`}).join('');\n $('tot').textContent='Across all examples: '+tn+' trades, '+tw+' wins, net '+(tR>=0?'+':'')+fx(tR,1)+'R. Synthetic paths: this validates the mechanics (stops, targets, R:R), not an edge.'}\nfunction draw(){\nconst cv=$('cv'),d=devicePixelRatio||1,W=cv.clientWidth,Ht=cv.clientHeight;\nif(cv.width!==Math.round(W*d)){cv.width=Math.round(W*d);cv.height=Math.round(Ht*d)}\nconst x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,W,Ht);\nconst cs=getComputedStyle(document.documentElement),v=n=>cs.getPropertyValue(n).trim();\nconst pr=70,pl=6,tp=10,bt=10,pw=W-pr-pl,ph=Ht-tp-bt,YMIN=.2,YMAX=S.mx,N=S.N,C=S.C;\nconst y=f=>D>0?tp+(YMAX-f)/(YMAX-YMIN)*ph:tp+(f-YMIN)/(YMAX-YMIN)*ph,xi=i=>pl+(i+.5)/N*pw,bw=Math.max(2,pw/N*.62);\nx.font='10px system-ui,sans-serif';x.textBaseline='middle';\nconst KEY=[1,1.61,2.61,3.14,4.23,4.88,5.6,6.18,7.85,9.44],lab=[];\nLV.forEach(f=>{if(f<.5||f>YMAX)return;const yy=y(f),k=KEY.includes(f);x.strokeStyle=v('--fl');x.globalAlpha=k?.8:.35;x.beginPath();x.moveTo(pl,yy);x.lineTo(pl+pw,yy);x.stroke();x.globalAlpha=1;\nif(k||!lab.some(q=>Math.abs(q-yy)<10)){lab.push(yy);x.fillStyle=v('--mu');x.fillText(f,pl+pw+6,yy)}});\nfor(let i=0;i<=cur;i++){const c=C[i],up=(c.c>=c.o)===(D>0);x.strokeStyle=x.fillStyle=up?v('--up'):v('--dn');\nx.beginPath();x.moveTo(xi(i),y(c.h));x.lineTo(xi(i),y(c.l));x.stroke();x.fillRect(xi(i)-bw/2,Math.min(y(c.o),y(c.c)),bw,Math.max(1.5,Math.abs(y(c.o)-y(c.c))))}\nS.T.forEach(t=>{if(cur<t.fi)return;const e=xi(Math.min(cur,t.ex));x.lineWidth=1.3;\n [[t.pl,'--ok',[5,4]],[t.sl,'--bad',[]],[t.tp,'--ac',[5,4]]].forEach(L=>{x.strokeStyle=v(L[1]);x.setLineDash(L[2]);x.beginPath();x.moveTo(xi(t.fi),y(L[0]));x.lineTo(e,y(L[0]));x.stroke()});x.setLineDash([]);x.lineWidth=1;\n x.fillStyle=v('--ok');x.beginPath();x.arc(xi(t.fi),y(t.pl),4,0,7);x.fill();x.font='bold 10px system-ui,sans-serif';x.fillStyle=v('--tx');x.fillText('T'+t.n,xi(t.fi)-6,y(t.pl)+(D>0?14:-14));\n if(cur>=t.ex&&!t.open){const w=t.res>0;x.fillStyle=w?v('--ac'):v('--bad');x.beginPath();x.arc(xi(t.ex),y(w?t.tp:t.sl),4,0,7);x.fill();x.fillText(w?'+'+fx(t.rr,1)+'R':'−1R',xi(t.ex)+7,y(w?t.tp:t.sl))}x.font='10px system-ui,sans-serif'});\nconst lp=C[cur].c;x.fillStyle=v('--tx');x.fillRect(pl+pw+2,y(lp)-8,pr-8,16);x.fillStyle=v('--bg');x.font='bold 11px system-ui,sans-serif';x.fillText(fx(lp),pl+pw+8,y(lp));\n}\nfunction ui(){\nlet si=0;STEPS.forEach((s,k)=>{if(s[0]<=cur)si=k});\n$('nt').textContent=STEPS[si][1];$('nb').innerHTML='<p>'+STEPS[si][2]+'</p>';\n$('st').querySelectorAll('button').forEach((b,k)=>b.className=k===si?'on':'g');$('sc').value=cur;\n$('h1').textContent=S.T.filter(t=>cur>=t.fi&&cur<t.ex).length;\nconst cl=S.T.filter(t=>cur>=t.ex&&!t.open),R=cl.reduce((a,t)=>a+t.res,0);$('h2').textContent=cl.length;$('h3').textContent=(R>=0?'+':'')+fx(R,1)+'R · '+(R>=0?'+':'−')+'$'+fx(Math.abs(R)*10,0);\ndraw()}\nfunction pause(){clearInterval(timer);timer=null;$('pl').textContent='Play'}\nfunction play(){if(cur>=S.N-1)cur=0;$('pl').textContent='Pause';timer=setInterval(()=>{cur++;if(cur>=S.N-1){cur=S.N-1;pause()}else if($('ap').checked&&STEPS.some(s=>s[0]===cur))pause();ui()},480/(+$('sp').value))}\n$('pl').onclick=()=>timer?pause():play();\n$('nx').onclick=()=>{pause();const n=STEPS.find(s=>s[0]>cur);cur=n?n[0]:S.N-1;ui()};\n$('bk').onclick=()=>{pause();const p=STEPS.filter(s=>s[0]<cur).pop();cur=p?p[0]:0;ui()};\n$('rs').onclick=()=>{pause();cur=0;ui()};\n$('sc').oninput=e=>{pause();cur=+e.target.value;ui()};\n$('sp').oninput=()=>{if(timer){pause();play()}};\n$('ld').onclick=()=>{const rows=$('ta').value.split('\\n').map(l=>(l.replace(/^\\s*BOS\\s+\\d+\\s*-\\s*\\d+/i,'').match(/\\d+(\\.\\d+)?/g)||[]).map(Number)).filter(a=>a.length>=3);\n if(!rows.length)return;const first=all().length;rows.forEach((r,i)=>CUS.push(['Your rows','Row '+(CUS.length+1),1,r,'Your pasted sequence.']));load(first)};\naddEventListener('resize',()=>S&&draw());\nload(0);\n<\/script></body></html>\n"},{"name":"Fib Staircase — Three Recurring Pullbacks.html","title":"Fib Staircase — Three Recurring Pullbacks","html":"<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Fib Staircase — Three Recurring Pullbacks</title>\n<style>\n:root{--bg:#f6f4ef;--sf:#fff;--tx:#1d1b18;--mu:#6b665d;--ln:#ddd8cc;--ac:#8a5a00;--ok:#1f7a3d;--bad:#b3261e;--up:#3b5bdb;--dn:#e03131;--fl:#7b93a0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#131210;--sf:#1b1a17;--tx:#ece8de;--mu:#9a958a;--ln:#33302a;--ac:#e0a93b;--ok:#5fcf86;--bad:#ff7b72;--up:#6f8cff;--dn:#ff6b6b;--fl:#7f9aa8;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg:#131210;--sf:#1b1a17;--tx:#ece8de;--mu:#9a958a;--ln:#33302a;--ac:#e0a93b;--ok:#5fcf86;--bad:#ff7b72;--up:#6f8cff;--dn:#ff6b6b;--fl:#7f9aa8;color-scheme:dark}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Georgia,serif}\nmain{max-width:1000px;margin:0 auto;padding:16px 12px 50px}\nh1{font-size:22px;margin:6px 0 2px}h2{font-size:16px;margin:0 0 6px;color:var(--ac)}.sub{color:var(--mu);margin:0 0 12px;font-size:14px}\n.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:12px}\n.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;margin-bottom:12px}\n.g3 .card{margin:0}\n.sys{font:13px system-ui,sans-serif}.sys label{display:block;color:var(--mu);font-size:11px;margin-top:6px}\nselect{width:100%;padding:6px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif}\n.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.k{border:1px solid var(--ln);border-radius:8px;padding:5px 8px}.k small{display:block;font-size:11px;color:var(--mu)}.k b{font-size:15px}\n.tagok{color:var(--ok)}.tagbad{color:var(--bad)}\ncanvas{width:100%;height:440px;display:block}\n.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font:13px system-ui,sans-serif}\nbutton{padding:8px 12px;border:1px solid var(--ac);background:var(--ac);color:var(--bg);border-radius:6px;font:600 13px system-ui,sans-serif;cursor:pointer}\nbutton.g{background:transparent;color:var(--tx);border-color:var(--ln iv><div class=\"k\"><small>Realized</small><b id=\"h3\">0R · $0</b></div></div></div>\n<p class=\"cap\">Candles are synthetic and follow one master path that contains all three setups in order: 2.61→1.61, 3.14→2.61, 4.88→4.23. $ assumes 1% risk of $1,000 per trade. Change SL and TP in the cards; the replay recomputes.</p>\n</main>\n<script>\nconst $=id=>document.getElementById(id);\nconst LV=[0,.5,.62,1,1.27,1.38,1.5,1.61,1.88,2,2.36,2.61,2.88,3.14,3.61,3.82,4.23,4.88,5.6,6.18];\nconst SET=[\n{k:'C',pk:2.61,pl:1.61,np:[4.88,2.61,4.23,3.14,3.61],ki:26,sl:1.27,tp:2.61},\n{k:'A',pk:3.14,pl:2.61,np:[4.23,4.88,5.6,3.82,3.82,4.23],ki:43,sl:2,tp:4.23},\n{k:'B',pk:4.88,pl:4.23,np:[5.6,6.18,5.6,5.6,5.6],ki:66,sl:3.82,tp:5.6}];\nconst KP=[[0,.9],[4,1.04],[10,1.61],[15,1.27],[26,2.61],[33,1.54],[43,3.14],[50,2.54],[66,4.88],[73,4.16],[84,5.6],[92,4.4],[105,6.18]],N=106;\nfunction rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}\nconst tg=i=>{for(let k=0;k<KP.length-1;k++){const a=KP[k],b=KP[k+1];if(i>=a[0]&&i<=b[0])return a[1]+(b[1]-a[1])*(i-a[0])/(b[0]-a[0])}return 6.18};\nconst C=[];(function(){const r=rng(5);let nz=0;for(let i=0;i<N;i++){const t=tg(i),sg=.045+.025*t;nz=.4*nz+(r()-.5)*2.4*sg;const c=Math.max(.2,t+nz),o=i?C[i-1].c:t;C.push({o,c,h:Math.max(o,c)+r()*sg*.8,l:Math.min(o,c)-r()*sg*.8})}})();\nconst fx=(v,d=2)=>(+v).toFixed(d);\nlet T=[],STEPS=[],cur=0,timer=null;\nfunction build(){\nT=SET.map(s=>{\n let pi=Math.max(0,s.ki-3);for(let i=pi;i<=Math.min(N-1,s.ki+3);i++)if(C[i].h>C[pi].h)pi=i;\n let fi=-1;for(let i=pi+1;i<N;i++)if(C[i].l<=s.pl){fi=i;break}\n const risk=s.pl-s.sl,rr=(s.tp-s.pl)/risk,k=s.np.filter(x=>x>=s.tp).length,p=k/s.np.length;\n let ex=N-1,res=null;\n if(fi>=0)for(let j=fi;j<N;j++){if(C[j].l<=s.sl){ex=j;res=-1;break}if(j>fi&&C[j].h>=s.tp){ex=j;res=rr;break}}\n const open=fi>=0&&res===null;if(open)res=(C[N-1].c-s.pl)/risk;\n return{...s,pi,fi,risk,rr,k,p,E:p*rr-(1-p),ex,res,open}});\nSTEPS=[[0,'BOS: the staircase begins','Price breaks above the 0–100 swing (1.00). The ladder is the map. In your 21 samples three legs repeat: <b>2.61→1.61</b>, <b>3.14→2.61</b> and <b>4.88→4.23</b>. Each is armed with a limit at its pullback level; nothing is bought at the peak.']];\nT.forEach(t=>{if(t.fi<0)return;\n STEPS.push([t.pi,t.k+' · peak at '+t.pk,'Price tags '+fx(t.pk)+'. Seen '+t.np.length+' times in the data, the pullback then ended at '+fx(t.pl)+'. Place the limit there. Do not chase.']);\n STEPS.push([t.fi,t.k+' · limit filled at '+fx(t.pl),'Entry '+fx(t.pl)+', SL '+fx(t.sl)+', TP '+fx(t.tp)+'. Risk '+fx(t.risk)+', reward '+fx(t.tp-t.pl)+', <b>R:R 1:'+fx(t.rr,1)+'</b> '+(t.rr>=2?'<span class=\"tagok\">✔ meets 1:2</span>':'<span class=\"tagbad\">✘ below 1:2, skip it</span>')+'. Historical next peak reached TP in '+t.k+' of '+t.np.length+' (upper bound).']);\n STEPS.push([t.ex,t.k+(t.res<0?' · stopped out':t.open?' · still open':' · target hit'),t.res<0?'Price lost '+fx(t.sl)+' first. −1R, about −$10. The plan paid for this outcome in advance.':t.open?'Not resolved by the end of the path.':'TP '+fx(t.tp)+' hit. +'+fx(t.rr,1)+'R, about +$'+fx(t.rr*10,0)+'.']);});\nSTEPS.sort((a,b)=>a[0]-b[0]);\n$('st').innerHTML='';STEPS.forEach((s,k)=>{const b=document.createElement('button');b.textContent=k+1;b.onclick=()=>{pause();cur=s[0];ui()};$('st').appendChild(b)});\n$('cards').innerHTML=T.map((t,i)=>{const cnt={};t.np.forEach(x=>cnt[x]=(cnt[x]||0)+1);\n const sls=LV.filter(l=>l<t.pl-.05),tps=LV.filter(l=>l>t.pl+.05&&l<=6.18);\n return `<div class=\"card sys\"><h2>${t.k} · ${fx(t.pk)} → ${fx(t.pl)}</h2><div>Seen ${t.np.length} of 21 samples. Next peak after the pullback: ${Object.entries(cnt).sort((a,b)=>a[0]-b[0]).map(e=>e[0]+(e[1]>1?'×'+e[1]:'')).join(' · ')}</div>\n <div class=\"row2\"><div><label>Stop loss</label><select onchange=\"SET[${i}].sl=+this.value;go()\">${sls.map(l=>`<option ${l===t.sl?'selected':''}>${l}</option>`).join('')}</select></div>\n <div><label>Take profit</label><select onchange=\"SET[${i}].tp=+this.value;go()\">${tps.map(l=>`<option ${l===t.tp?'selected':''}>${l}</option>`).join('')}</select></div></div>\n <div class=\"row2\" style=\"margin-top:8px\"><div class=\"k\"><small>Risk : Reward</small><b class=\"${t.rr>=2?'tagok':'tagbad'}\">1 : ${fx(t.rr,1)}</b></div><div class=\"k\"><small>TP reached after pullback</small><b>${t.k}/${t.np.length}</b></div>\n <div class=\"k\"><small>Expectancy (upper bound)</small><b>${t.E>=0?'+':''}${fx(t.E,2)}R</b></div><div class=\"k\"><small>Gate</small><b class=\"${t.rr>=2?'tagok':'tagbad'}\">${t.rr>=2?'✔ 1:2 met':'✘ skip'}</b></div></div></div>`}).join('');\n}\nfunction go(){pause();build();ui()}\nfunction draw(){\nconst cv=$('cv'),d=devicePixelRatio||1,W=cv.clientWidth,Ht=cv.clientHeight;\nif(cv.width!==Math.round(W*d)){cv.width=Math.round(W*d);cv.height=Math.round(Ht*d)}\nconst x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,W,Ht);\nconst cs=getComputedStyle(document.documentElement),v=n=>cs.getPropertyValue(n).trim();\nconst pr=70,pl=6,tp=10,bt=10,pw=W-pr-pl,ph=Ht-tp-bt,YMIN=.2,YMAX=6.5;\nconst y=p=>tp+(YMAX-p)/(YMAX-YMIN)*ph,xi=i=>pl+(i+.5)/N*pw,bw=Math.max(2,pw/N*.62);\nx.font='10px system-ui,sans-serif';x.textBaseline='middle';\nconst KEY=[1,1.61,2.61,3.14,4.23,4.88,5.6,6.18],lab=[];\nLV.forEach(f=>{if(f<.5)return;const yy=y(f),k=KEY.includes(f);x.strokeStyle=v('--fl');x.globalAlpha=k?.8:.35;x.beginPath();x.moveTo(pl,yy);x.lineTo(pl+pw,yy);x.stroke();x.globalAlpha=1;\nif(k||!lab.some(q=>Math.abs(q-yy)<10)){lab.push(yy);x.fillStyle=v('--mu');x.fillText(f,pl+pw+6,yy)}});\nfor(let i=0;i<=cur;i++){const c=C[i],up=c.c>=c.o;x.strokeStyle=x.fillStyle=up?v('--up'):v('--dn');\nx.beginPath();x.moveTo(xi(i),y(c.h));x.lineTo(xi(i),y(c.l));x.stroke();x.fillRect(xi(i)-bw/2,Math.min(y(c.o),y(c.c)),bw,Math.max(1.5,Math.abs(y(c.o)-y(c.c))))}\nT.forEach(t=>{if(t.fi<0)return;\n if(cur>=t.pi&&cur<t.fi){x.strokeStyle=v('--ok');x.globalAlpha=.6;x.setLineDash([2,4]);x.beginPath();x.moveTo(xi(t.pi),y(t.pl));x.lineTo(xi(Math.min(cur,t.fi)),y(t.pl));x.stroke();x.setLineDash([]);x.globalAlpha=1}\n if(cur>=t.fi){const e=xi(Math.min(cur,t.ex));x.lineWidth=1.6;\n [[t.pl,'--ok',[6,4]],[t.sl,'--bad',[]],[t.tp,'--ac',[6,4]]].forEach(L=>{x.strokeStyle=v(L[1]);x.setLineDash(L[2]);x.beginPath();x.moveTo(xi(t.fi),y(L[0]));x.lineTo(e,y(L[0]));x.stroke()});x.setLineDash([]);x.lineWidth=1;\n x.fillStyle=v('--ok');x.beginPath();x.arc(xi(t.fi),y(t.pl),5,0,7);x.fill();x.font='bold 11px system-ui,sans-serif';x.fillStyle=v('--tx');x.fillText(t.k+' 1:'+fx(t.rr,1),xi(t.fi)-8,y(t.tp)-9);x.font='10px system-ui,sans-serif';\n if(cur>=t.ex){const win=t.res>0;x.fillStyle=win?v('--ac'):v('--bad');x.beginPath();x.arc(xi(t.ex),y(win?t.tp:t.sl),5,0,7);x.fill();x.font='bold 11px system-ui,sans-serif';x.fillText(win?'+'+fx(t.rr,1)+'R':'−1R',xi(t.ex)+8,y(win?t.tp:t.sl));x.font='10px system-ui,sans-serif'}}});\nconst lp=C[cur].c;x.fillStyle=v('--tx');x.fillRect(pl+pw+2,y(lp)-8,pr-8,16);x.fillStyle=v('--bg');x.font='bold 11px system-ui,sans-serif';x.fillText(fx(lp),pl+pw+8,y(lp));\n}\nfunction ui(){\nlet si=0;STEPS.forEach((s,k)=>{if(s[0]<=cur)si=k});\n$('nt').textContent=STEPS[si][1];$('nb').innerHTML='<p>'+STEPS[si][2]+'</p>';\n$('st').querySelectorAll('button').forEach((b,k)=>b.className=k===si?'on':'g');\n$('sc').value=cur;\nconst op=T.find(t=>t.fi>=0&&cur>=t.fi&&cur<t.ex);$('h1').textContent=op?op.k+' @ '+fx(op.pl):'—';\nconst cl=T.filter(t=>t.fi>=0&&cur>=t.ex&&!t.open),R=cl.reduce((s,t)=>s+t.res,0);\n$('h2').textContent=cl.length;$('h3').textContent=(R>=0?'+':'')+fx(R,1)+'R · '+(R>=0?'+':'−')+'$'+fx(Math.abs(R)*10,0);\ndraw()}\nfunction pause(){clearInterval(timer);timer=null;$('pl').textContent='Play'}\nfunction play(){if(cur>=N-1)cur=0;$('pl').textContent='Pause';timer=setInterval(()=>{cur++;if(cur>=N-1){cur=N-1;pause()}else if($('ap').checked&&STEPS.some(s=>s[0]===cur))pause();ui()},480/(+$('sp').value))}\n$('pl').onclick=()=>timer?pause():play();\n$('nx').onclick=()=>{pause();const n=STEPS.find(s=>s[0]>cur);cur=n?n[0]:N-1;ui()};\n$('bk').onclick=()=>{pause();const p=STEPS.filter(s=>s[0]<cur).pop();cur=p?p[0]:0;ui()};\n$('rs').onclick=()=>{pause();cur=0;ui()};\n$('sc').max=N-1;$('sc').oninput=e=>{pause();cur=+e.target.value;ui()};\n$('sp').oninput=()=>{if(timer){pause();play()}};\naddEventListener('resize',draw);\nbuild();ui();\n<\/script></body></html>\n"},{"name":"Harmonic Trading Plan — Operating Panel.html","title":"Harmonic Trading Plan — Operating Panel","html":"<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Harmonic Trading Plan — Operating Panel</title>\n<style>\n:root{--bg:#f6f4ef;--sf:#fff;--tx:#1d1b18;--mu:#6b665d;--ln:#ddd8cc;--ac:#8a5a00;--ok:#1f7a3d;--bad:#b3261e;--wa:#9a6b00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#131210;--sf:#1d1b18;--tx:#ece8de;--mu:#9a958a;--ln:#33302a;--ac:#e0a93b;--ok:#5fcf86;--bad:#ff7b72;--wa:#e0b04a;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg:#131210;--sf:#1d1b18;--tx:#ece8de;--mu:#9a958a;--ln:#33302a;--ac:#e0a93b;--ok:#5fcf86;--bad:#ff7b72;--wa:#e0b04a;color-scheme:dark}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Georgia,'Times New Roman',serif}\nmain{max-width:860px;margin:0 auto;padding:20px 16px 60px}\nh1{font-size:24px;margin:8px 0 2px;letter-spacing:.2px}h2{font-size:17px;margin:0 0 10px;color:var(--ac)}\n.sub{color:var(--mu);margin:0 0 18px}\nsection{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:16px;margin-bottom:16px}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}\nlabel{display:block;font:12px system-ui,sans-serif;color:var(--mu);margin-bottom:3px}\ninput,select{width:100%;padding:8px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif}\nbutton{padding:9px 14px;border:1px solid var(--ac);background:var(--ac);color:var(--bg);border-radius:6px;font:600 14px system-ui,sans-serif;cursor:pointer}\nbutton.g{background:transparent;color:var(--tx);border-color:var(--ln)}button:disabled{opacity:.35;cursor:not-allowed}\n.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}\n.rule{border:1px solid var(--ln);border-radius:8px;padding:10px}.rule b{display:block;font:700 22px system-ui,sans-serif;color:var(--ac)}.rule span{font:13px system-ui,sans-serif;color:var(--mu)}\n.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:12px 0}\n.k{border:1px solid var(--ln);border-radius:8px;padding:8px}.k small{display:block;font:11px system-ui,sans-serif;color:var(--mu)}.k div{font:700 17px system-ui,sans-serif}\ntable{width:100%;border-collapse:collapse;font:13px system-ui,sans-serif}th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--ln)}\n.tag{padding:2px 7px;border-radius:99px;font-size:11px;border:1px solid}\n.t1{color:var(--ok)}.t2{color:var(--wa)}.t3{color:var(--bad)}\n.bar{height:6px;background:var(--ln);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}\n.gate li{list-style:none;padding:5px 0;font:14px system-ui,sans-serif}.gate{padding:0;margin:8px 0}\n.gate .p::before{content:\"✔ \";color:var(--ok)}.gate .f::before{content:\"✘ \";color:var(--bad)}\n.dots{display:flex;gap:8px;margin:6px 0}.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--ac)}.dot.on{background:var(--ac)}\n.lock{font:600 14px system-ui,sans-serif;padding:8px;border-radius:6px;background:var(--bg);border:1px solid var(--ln)}\n.scroll{overflow-x:auto}\n.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}\n.cap{font:12px system-ui,sans-serif;color:var(--mu);margin-top:8px}\n</style></head><body><main>\n<h1>Harmonic Trading Plan</h1>\n<p class=\"sub\">Rules fixed in advance. The tool enforces them so the moment of the trade doesn’t have to.</p>\n\n<section><h2>1 · The six laws</h2>\n<div class=\"rules\">\n<div class=\"rule\"><b>2</b><span>trades per day, maximum</span></div>\n<div class=\"rule\"><b>1%</b><span>of account at risk per trade, set before entry</span></div>\n<div class=\"rule\"><b>1 : 2</b><span>minimum reward to risk</span></div>\n<div class=\"rule\"><b>5%</b><span>weekly risk cap</span></div>\n<div class=\"rule\"><b>2×</b><span>confirmations: harmonic level + candle or RSI</span></div>\n<div class=\"rule\"><b>24 / 12 / 48h</span></b><span>pause after loss / win / skipped stop</span></div>\n</div></section>\n\n<section><h2>2 · Setup calculator</h2>\n<div class=\"grid\">\n<div><label>Account ($)</label><input id=\"acc\" type=\"number\" value=\"1000\"></div>\n<div><label>Risk per trade (%)</label><input id=\"rp\" type=\"number\" step=\".1\" value=\"1\"></div>\n<div><label>Swing start</label><input id=\"a\" type=\"number\" step=\"any\" value=\"1.0500\"></div>\n<div><label>Swing end</label><input id=\"b\" type=\"number\" step=\"any\" value=\"1.0800\"></div>\n<div><label>Entry retracement</label><select id=\"r\"><option value=\".382\">38.2%</option><option value=\".5\">50%</option><option value=\".618\" selected>61.8%</option></select></div>\n<div><label>Target extension</label><select id=\"k\"><option value=\"1.414\">141.4% (√2)</option><option value=\"1.618\" selected>161.8% (Φ)</option><option value=\"2.72\">272% (e)</option></select></div>\n<div><label>Stop (blank = swing start)</label><input id=\"s\" type=\"number\" step=\"any\" placeholder=\"auto\"></div>\n</div>\n<div class=\"out\" id=\"out\"></div>\n<ul class=\"gate\" id=\"gate\"></ul>\n<div class=\"row\"><button id=\"log\" disabled>Log trade</button><span class=\"cap\" id=\"gcap\"></span></div>\n<p class=\"cap\">Direction is read from the swing: end above start = long, below = short. Position size = risk dollars ÷ stop distance. Lots assume 100,000 units; adjust for your instrument.</p>\n</section>\n\n<section><h2>3 · Level ladder</h2>\n<div class=\"scroll\"><table><thead><tr><th>Level</th><th>Role</th><th>Price</th><th>Status</th></tr></thead><tbody id=\"lad\"></tbody></table></div>\n<p class=\"cap\">Green = plan around it. Amber = reassess or close. Red = nothing in this document shows these are reached with any frequency; treat as unvalidated until your journal says otherwise.</p></section>\n\n<section><h2>4 · Today’s discipline</h2>\n<div>Trades today <span id=\"tc\"></span></div><div class=\"dots\" id=\"dots\"></div>\n<div style=\"margin:8px 0\">Weekly risk used <b id=\"wr\"></b> of 5%</div><div class=\"bar\"><i id=\"wb\" style=\"width:0\"></i></div>\n<div class=\"lock\" id=\"lk\" style=\"margin-top:10px\"></div>\n<h2 style=\"margin-top:16px\">Journal</h2>\n<div class=\"scroll\"><table><tbody id=\"jr\"></tbody></table></div>\n<div class=\"row\" style=\"margin-top:10px\"><button class=\"g\" id=\"rs\">Reset journal</button></div>\n<p class=\"cap\">Mark every trade’s result. After 30 closed trades, compare which levels actually paid. That is the backtest.</p></section>\n\n<section><h2>5 · Progress spiral</h2>\n<svg id=\"sp\" viewBox=\"0 0 420 330\" width=\"100%\" role=\"img\" aria-label=\"Progress spiral\"></svg>\n<p class=\"cap\">Tap a stage to mark it earned. Stages are behavioral, not price.</p></section>\n</main>\n<script>\nconst $=id=>document.getElementById(id);\nlet S={trades:[],stages:[]};\ntry{const x=localStorage.getItem('hp1');if(x)S=JSON.parse(x)}catch(e){}\nconst save=()=>{try{localStorage.setItem('hp1',JSON.stringify(S))}catch(e){}};\nconst dk=t=>new Date(t).toDateString();\nconst wkStart=()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()};\nconst f=(n,d=4)=>isFinite(n)?(+n).toFixed(d):'—';\nlet calc={};\nfunction lockUntil(){let m=0;S.trades.forEach(t=>{if(t.res){const h=t.res==='loss'?24:t.res==='win'?12:48;m=Math.max(m,t.rt+h*36e5)}});return m}\nfunction compute(){\n const acc=+$('acc').value,rp=+$('rp').value,a=+$('a').value,b=+$('b').value,r=+$('r').value,k=+$('k').value;\n const R=b-a,entry=b-r*R,tgt=a+k*R,stop=$('s').value===''?a:+$('s').value;\n const dist=Math.abs(entry-stop),risk$=acc*rp/100,units=dist?risk$/dist:NaN;\n const rr=dist?Math.abs(tgt-entry)/dist:NaN;\n const goodStop=R>0?stop<entry:stop>entry;\n calc={entry,stop,tgt,rr,rp};\n $('out').innerHTML=[['Entry',f(entry)],['Stop',f(stop)],['Target',f(tgt)],['R : R',f(rr,2)],['Risk $',f(risk$,2)],['Units',f(units,0)],['Lots',f(units/1e5,3)]].map(x=>`<div class=\"k\"><small>${x[0]}</small><div>${x[1]}</div></div>`).join('');\n const tt=S.trades.filter(t=>dk(t.ts)===dk(Date.now())).length;\n const wk=S.trades.filter(t=>t.ts>=wkStart()).reduce((s,t)=>s+t.risk,0);\n const lk=lockUntil()>Date.now();\n const G=[[rr>=2,'Reward to risk is at least 1 : 2 ('+f(rr,2)+')'],[goodStop&&dist>0,'Stop sits on the invalidation side of entry'],[rp<=1,'Risk per trade is 1% or less'],[tt<2,'Fewer than 2 trades taken today ('+tt+')'],[wk+rp<=5,'Weekly cap holds after this trade ('+f(wk+rp,1)+'%)'],[!lk,'No pause active']];\n const c1=$('c1')?$('c1').checked:false,c2=$('c2')?$('c2').checked:false;\n $('gate').innerHTML=G.map(g=>`<li class=\"${g[0]?'p':'f'}\">${g[1]}</li>`).join('')+`<li><label style=\"display:inline;font-size:14px;color:var(--tx)\"><input id=\"c1\" type=\"checkbox\" style=\"width:auto\" ${c1?'checked':''}> Price is at a harmonic level (38.2 / 61.8 / 141.4 …)</label></li><li><label style=\"display:inline;font-size:14px;color:var(--tx)\"><input id=\"c2\" type=\"checkbox\" style=\"width:auto\" ${c2?'checked':''}> Second confirmation: candlestick pattern or RSI divergence</label></li>`;\n $('c1').onchange=$('c2').onchange=compute;\n const ok=G.every(g=>g[0])&&c1&&c2;$('log').disabled=!ok;$('gcap').textContent=ok?'All gates pass.':'Blocked until every gate is green.';\n ladder(a,R);track();\n}\nfunction ladder(a,R){\n const L=[[1.414,'√2 pivot — quick entry reference',1],[1.618,'Φ — primary target',1],[2.72,'e — partial profit, trail stop',1],[3.14,'π — cycle cap, reassess',2],[3.6,'Circle — close and reset',2],[6.83,'Φ⁴ — scale-out zone',3],[9.44,'3π — hard reversal',3],[11.05,'Φ+√5 — full exit',3]];\n const tg=['','plan','reassess','unvalidated'],cl=['','t1','t2','t3'];\n $('lad').innerHTML=L.map(l=>`<tr><td>${(l[0]*100).toFixed(1)}%</td><td>${l[1]}</td><td>${f(a+l[0]*R)}</td><td><span class=\"tag ${cl[l[2]]}\">${tg[l[2]]}</span></td></tr>`).join('');\n}\nfunction track(){\n const tt=S.trades.filter(t=>dk(t.ts)===dk(Date.now())).length;\n $('tc').textContent=tt+' / 2';$('dots').innerHTML=[0,1].map(i=>`<div class=\"dot ${i<tt?'on':''}\"></div>`).join('');\n const wk=S.trades.filter(t=>t.ts>=wkStart()).reduce((s,t)=>s+t.risk,0);\n $('wr').textContent=f(wk,1)+'%';$('wb').style.width=Math.min(100,wk/5*100)+'%';\n clock();\n $('jr').innerHTML=S.trades.slice().reverse().map((t,i)=>{const ix=S.trades.length-1-i;return `<tr><td>${new Date(t.ts).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</td><td>${f(t.entry)} → ${f(t.tgt)}</td><td>${f(t.rr,1)}R</td><td>${t.res?t.res:`<button class=\"g\" onclick=\"res(${ix},'win')\">Win</button> <button class=\"g\" onclick=\"res(${ix},'loss')\">Loss</button> <button class=\"g\" onclick=\"res(${ix},'nostop')\">No stop</button>`}</td></tr>`}).join('')||'<tr><td class=\"cap\">No trades logged.</td></tr>';\n}\nfunction clock(){const u=lockUntil(),d=u-Date.now();\n $('lk').textContent=d>0?'Paused — '+Math.floor(d/36e5)+'h '+Math.floor(d%36e5/6e4)+'m remaining. Use it to review the trade against its level, not to find the next one.':'No pause active. Trading permitted within the laws above.'}\nwindow.res=(i,r)=>{S.trades[i].res=r;S.trades[i].rt=Date.now();save();compute()};\n$('log').onclick=()=>{S.trades.push({ts:Date.now(),risk:calc.rp,entry:calc.entry,tgt:calc.tgt,rr:calc.rr,res:null});save();$('c1').checked=false;$('c2').checked=false;compute()};\n$('rs').onclick=()=>{if(confirm('Erase the journal?')){S.trades=[];save();compute()}};\n['acc','rp','a','b','r','k','s'].forEach(i=>$(i).oninput=compute);\nsetInterval(clock,30000);\n// spiral\nconst ST=[['100%','Unity','Discipline set'],['161.8%','Φ','Stops on every trade'],['314%','π','No overtrading'],['683%','Φ⁴','Rules systemized'],['944%','3π','Patient execution'],['1105%','Φ+√5','Intuition earned']];\nfunction spiral(){\n const cx=210,cy=165;let p='',pts=[];\n for(let i=0;i<=360;i++){const th=i/360*Math.PI*3.2,rr=8+Math.exp(th*.42)*3.1;const x=cx+rr*Math.cos(th),y=cy+rr*Math.sin(th);p+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}\n ST.forEach((s,j)=>{const th=(j+.6)/6*Math.PI*3.2,rr=8+Math.exp(th*.42)*3.1;pts.push([cx+rr*Math.cos(th),cy+rr*Math.sin(th),s,j])});\n $('sp').innerHTML=`<path d=\"${p}\" fill=\"none\" stroke=\"var(--ln)\" stroke-width=\"3\"/>`+pts.map(q=>{const on=S.stages.includes(q[3]);return `<g onclick=\"tg(${q[3]})\" style=\"cursor:pointer\"><circle cx=\"${q[0]}\" cy=\"${q[1]}\" r=\"11\" fill=\"${on?'var(--ac)':'var(--sf)'}\" stroke=\"var(--ac)\" stroke-width=\"2\"/><text x=\"${q[0]}\" y=\"${q[1]+4}\" text-anchor=\"middle\" font-size=\"10\" font-family=\"system-ui\" fill=\"${on?'var(--bg)':'var(--tx)'}\">${q[3]+1}</text></g>`}).join('')+`<g font-family=\"system-ui\" font-size=\"11\" fill=\"var(--tx)\">${ST.map((s,j)=>`<text x=\"8\" y=\"${20+j*16}\" opacity=\"${S.stages.includes(j)?1:.55}\">${j+1}. ${s[0]} ${s[1]} — ${s[2]}</text>`).join('')}</g>`;\n}\nwindow.tg=j=>{const i=S.stages.indexOf(j);i<0?S.stages.push(j):S.stages.splice(i,1);save();spiral()};\nspiral();compute();\n<\/script></body></html>\n"},{"name":"Pattern Playbook — Candle Replay.html","title":"Pattern Playbook — Candle Replay","html":"<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Pattern Playbook — Candle Replay</title>\n<style>\n:root{--bg:#f6f4ef;--sf:#fff;--tx:#1d1b18;--mu:#6b665d;--ln:#ddd8cc;--ac:#8a5a00;--ok:#1f7a3d;--bad:#b3261e;--up:#3b5bdb;--dn:#e03131;--fl:#7b93a0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#131210;--sf:#1b1a17;--tx:#ece8de;--mu:#9a958a;--ln:#33302a;--ac:#e0a93b;--ok:#5fcf86;--bad:#ff7b72;--up:#6f8cff;--dn:#ff6b6b;--fl:#7f9aa8;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg:#131210;--sf:#1b1a17;--tx:#ece8de;--mu:#9a958a;--ln:#33302a;--ac:#e0a93b;--ok:#5fcf86;--bad:#ff7b72;--up:#6f8cff;--dn:#ff6b6b;--fl:#7f9aa8;color-scheme:dark}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Georgia,serif}\nmain{max-width:1000px;margin:0 auto;padding:16px 12px 50px}\nh1{font-size:22px;margin:6px 0 2px}h2{font-size:16px;margin:0 0 6px;color:var(--ac)}.sub{color:var(--mu);margin:0 0 12px;font-size:14px}\n.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:12px}\n.chips,.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.ctl{font:13px system-ui,sans-serif;margin-top:8px}\nbutton{padding:7px 11px;border:1px solid var(--ac);background:var(--ac);color:var(--bg);border-radius:6px;font:600 13px system-ui,sans-serif;cursor:pointer}\nbutton.g{background:transparent;color:var(--tx);border-color:var(--ln)}button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}\nselect{padding:6px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--tx);font:13px system-ui,sans-serif}\ncanvas{width:100%;height:430px;display:block}input[type=range]{accent-color:var(--ac)}\n.steps{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}\n.hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:8px;font-family:system-ui,sans-serif}\n.k{border:1px solid var(--ln);border-radius:8px;padding:5px 8px}.k small{display:block;font-size:11px;color:var(--mu)}.k b{font-size:15px}\ntable{width:100%;border-collapse:collapse;font:13px system-ui,sans-serif}th,td{text-align:left;padding:5px 4px;border-bottom:1px solid var(--ln)}\n.pos{color:var(--ok)}.neg{color:var(--bad)}.scroll{overflow-x:auto}\n.warn{border-left:4px solid var(--bad);padding:8px 12px;font:13px/1.5 system-ui,sans-serif;background:var(--sf);border-radius:0 8px 8px 0;margin-bottom:12px}\n.cap{font:12px system-ui,sans-serif;color:var(--mu)}\n@media(max-width:560px){canvas{height:340px}}\n</style></head><body><main>\n<h1>Pattern Playbook — your five setups, replayed</h1>\n<p class=\"sub\">Archmandis 1.41, Range OB683, Ascending Triangle, Wedge/Flag, and the three-entry Reverse model. Each one has a works version and a fails version.</p>\n<div class=\"warn\"><b>How these were built.</b> I redrew each pattern from the geometry of your screenshots (fib anchors, pink and blue boxes, level labels) and scripted candles through it. Entry and SL placement are my reading of your boxes; the Wedge/Flag chart labels both 2.23 and 6.82 near its target, so I used 2.23 of the pole and left 2.0 selectable. These are drawings of the setups, not recorded trades, so the “works” path always works. The “fails” path and the break-even column are what make the page honest.</div>\n<div class=\"card\"><div class=\"chips\" id=\"chips\"></div>\n<div class=\"ctl\"><span>Direction</span><button id=\"dB\" class=\"on\">Bullish ▲</button><button id=\"dS\" class=\"g\">Bearish ▼</button>\n<span style=\"margin-left:10px\">Outcome</span><button id=\"oW\" class=\"on\">Pattern works</button><button id=\"oF\" class=\"g\">Pattern fails</button>\n<label id=\"tpl\">Take profit <select id=\"tps\"></select></label></div></div>\n<div class=\"card\"><canvas id=\"cv\"></canvas>\n<div class=\"ctl\"><button id=\"pl\">Play</button><button class=\"g\" id=\"bk\">◀ Step</button><button class=\"g\" id=\"nx\">Step ▶</button><button class=\"g\" id=\"rs\">Restart</button><button class=\"g\" id=\"rrl\">New random replay</button>\n<label>Speed <input id=\"sp\" type=\"range\" min=\"1\" max=\"6\" value=\"3\"></label><label><input id=\"ap\" type=\"checkbox\" checked> Pause at each step</label></div>\n<input id=\"sc\" type=\"range\" min=\"0\" value=\"0\" style=\"width:100%;margin-top:6px\"><div class=\"steps\" id=\"st\"></div></div>\n<div class=\"card\"><h2 id=\"nt\"></h2><div id=\"nb\"></div>\n<div class=\"hud\"><div class=\"k\"><small>Open trades</small><b id=\"h1\">0</b></div><div class=\"k\"><small>Closed</small><b id=\"h2\">0</b></div><div class=\"k\"><small>Realized</small><b id=\"h3\">0R</b></div><div class=\"k\"><small>R:R (selected)</small><b id=\"h4\">—</b></div></div></div>\n<div class=\"card\"><h2>Scorecard — what each setup needs to be worth trading</h2><div class=\"scroll\"><table><thead><tr><th>Setup</th><th>R:R</th><th>If it works</th><th>If it fails</th><th>Break-even win rate</th></tr></thead><tbody id=\"sb\"></tbody></table></div>\n<p class=\"cap\">Break-even win rate = 1 ÷ (1 + R:R). It is the share of these setups that must work before the plan stops losing money. Your real hit rate is the number this page cannot supply; it has to come from logged examples, failures included.</p></div>\n<p class=\"cap\">Rules mirrored from your charts: stop entries fire on the break (OB BO EG, key level BO, trendline BO), limit entries fire on the retest (Range OB, Reverse model). Stop is checked before target within a candle. $ assumes 1% of $1,000 per trade. Bearish is the same structure mirrored.</p>\n</main>\n<script>\nconst $=id=>document.getElementById(id);\nconst L=-.66,u=.215;\nconst PT=[\n{id:'ARCH',name:'Archmandis 1.41',seed:3,\n w:[.95,1,.45,.78,.2,.62,0,L,L+u,L+.7*u,L+1.3*u,L+2.23*u,L+1.8*u,L+4.23*u,L+3.6*u,L+5.6*u,L+4.9*u,L+6.88*u],ff:11,tail:[L+1.55*u,L+.9*u,L-.4*u],\n bands:[[-.734,-.41,'key level 1.41–1.734'],[L+.618*u,L+.811*u,'OB / PB zone']],\n tr:[{n:'T1',type:'stop',e:L+u,sl:L-.03,after:9}],tpo:[[L+4.23*u,'4.23'],[L+5.6*u,'5.6'],[L+6.82*u,'6.82']],tpd:2,\n note:'Price breaks the first range, then extends into the 1.41–1.734 key level band. A new swing starts at that low; the entry is the engulfing break of the order block high, SL under the low, target 6.82 of the new swing.',\n st:[[0,'BO','Range, then BO','Price chops inside the first swing, then breaks its low (level 1 of that swing).'],[7,'1.41–1.734','Key level reaction','The down leg extends into the 1.41–1.734 band. Nothing is bought here; the plan waits for structure to turn.'],[9,'OB','Order block retest','Bounce, then a pullback into the 0.618–0.811 zone of the new swing.']]},\n{id:'RANGE',name:'Range OB683',seed:5,\n w:[7.2,4.65,5.2,3.1,3.7,1.15,0,1.9,.9,4,2.6,5.4,4.2,6.85,5.3,11.1],ff:14,tail:[6.2,3.2,-.7],\n bands:[[.5,1,'OB / entry zone'],[6.7,6.95,'roadblock 6.82']],\n tr:[{n:'T1',type:'limit',e:1,sl:-.12,after:7}],tpo:[[6.82,'6.82 roadblock'],[11.05,'11.05 target']],tpd:1,\n note:'A range grinds down into a multi-timeframe SNR and fib level. The OB retest with an engulfing break is the entry at level 1 of the new swing, SL under 0. The roadblock at 6.82 is the decision point; the target is 11.05.',\n st:[[0,'range','Range','Price grinds down inside a range toward a multi-timeframe SNR and fib level.'],[6,'key level','Key level (snr fib mtf)','The low prints at the confluence. This is 0 of the new swing.'],[8,'OB BO EG','OB, BO, engulfing','Retest of the order block, engulfing break. Entry at level 1, SL just under 0.'],[13,'roadblock','Roadblock 6.82','Price stalls at 6.82. Bank it or hold for 11.05; the TP selector flips this.'],[15,'target','Target 11.05','Roadblock breaks and price extends to 11.05.']]},\n{id:'TRI',name:'Ascending Triangle',seed:7,\n w:[0,1,.35,1.4,.78,1.4,.95,1.4,1.08,1.55,2.26],ff:9,tail:[1.47,1,.6],\n bands:[[.19,.38,'PB 0.618–0.811'],[1.38,1.43,'key level 1.41']],\n tr:[{n:'T1',type:'stop',e:1.41,sl:1.02,after:8}],tpo:[[1.73,'1.73'],[2,'2.0'],[2.23,'2.23 measured move']],tpd:2,\n note:'Impulse BO sets the swing (0 at the low, 1 at the high). Price pulls back into 0.618–0.811, builds higher lows under a flat top at 1.41, and the key level BO triggers the entry. Target is the measured move, 2.23 of the impulse.',\n st:[[1,'BO','Impulse BO','The impulse breaks structure: 0 at the low, 1 at the high.'],[2,'PB','PB 0.618–0.811','Pullback into the deep retracement zone. The pattern forms from here; you do not enter here.'],[8,'higher lows','Higher lows, flat top','Three higher lows pressing a flat top at 1.41.'],[9,'key level BO','Key level BO','Break above 1.41 triggers the stop entry. SL under the last higher low.']]},\n{id:'WEDGE',name:'Wedge / Flag',seed:9,\n w:[0,1,.35,1.27,.84,1.06,.7,.93,.48,2.26],ff:9,tail:[1.02,.3],\n bands:[[.19,.38,'PB 0.618–0.811']],\n tr:[{n:'T1',type:'stop',e:1,sl:.44,after:8}],tpo:[[2,'2.0'],[2.23,'2.23 measured move']],tpd:1,\n note:'Impulse pole, pullback into 0.618–0.811, then a falling wedge. The trendline BO (about level 1.0) triggers the entry, SL under the wedge low, target is the measured move of the pole.',\n st:[[1,'BO','Impulse BO','The pole: 0 at the low, 1 at the high.'],[2,'PB','PB 0.618–0.811','Pullback into the deep retracement zone.'],[8,'wedge low','Falling wedge','Lower highs and lower lows converge; selling pressure shrinks into the wedge low.'],[9,'trendline BO','Trendline BO','Break through the wedge trendline triggers entry. Target is 2.23 of the pole.']]},\n{id:'REV',name:'Reverse Entry 1.41 (3 entries)',seed:11,\n w:[0,.55,1.05,.82,1.9,1.35,2.4,2.15,2.7,1.95,3.9,3.08,4.45,3.5,5.65,4.8,6.9],ff:10,tail:[2.4,1.2,.8],\n bands:[[1.41,2,'PB×2 zone 2–1.41']],\n tr:[{n:'EN1',type:'limit',e:1.41,sl:1,tp:4.23,after:4},{n:'EN2',type:'limit',e:2,sl:1.41,tp:5.6,after:8},{n:'EN3',type:'limit',e:3.14,sl:2.62,tp:6.83,after:10}],\n note:'Your three-entry model: breaks at OB100 and 1.618–2, entry 1 on the 1.27–1.41 pullback (TP 4.23); entry 2 on the 2–1.41 double pullback (TP 5.6); entry 3 on the 3.14–2.618 double pullback (TP 6.83). Wicks count as breaks, and no new entry after a leg completes.',\n st:[[2,'BO1','BO1 = OB 100','First break at the order block (level 1).'],[4,'BO2','BO2 = 1.618–2','Second break pushes toward 1.618–2.'],[8,'BO3–4','BO3 = 2, BO4 = 2.61','Further breaks extend the move.'],[10,'BO5','BO5 = 3.14–3.82','Third leg breaks.'],[12,'BO6','BO6 = 4.23','Final break; EN1 target area.']]}];\nfunction rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}\nconst fx=(v,d=2)=>(+v).toFixed(d);\nfunction sim(pt,fail,tpi,seedOverride){\n const w=fail?pt.w.slice(0,pt.ff).concat(pt.tail):pt.w.slice();\n const mx=Math.max(...w),mn=Math.min(...w),YR=mx-mn,r=rng(seedOverride===undefined?pt.seed:seedOverride),WT=[0];let t=0;\n for(let i=1;i<w.length;i++){t+=Math.max(3,Math.round(Math.abs(w[i]-w[i-1])/YR*70*(.65+r()*.8)));WT.push(t)}\n const N=t+6,sg=.018*YR,C=[];\n for(let i=0;i<N;i++){let q=w[w.length-1],ph=0;for(let k=0;k<w.length-1;k++)if(i>=WT[k]&&i<=WT[k+1]){ph=(i-WT[k])/(WT[k+1]-WT[k]);q=w[k]+(w[k+1]-w[k])*ph;break}\n  const c=q+((r()-.5)*6*sg+(r()-.5)*.12*YR)*Math.sin(Math.PI*ph),o=i?C[i-1].c:q;C.push({o,c,h:Math.max(o,c)+r()*sg,l:Math.min(o,c)-r()*sg})}\n const T=[];\n pt.tr.forEach(tr=>{const e=tr.e,sl=tr.sl,tp=tr.tp!==undefined?tr.tp:pt.tpo[tpi][0];\n  let fi=-1;for(let j=WT[tr.after]+1;j<N;j++){if(tr.type==='stop'?C[j].h>=e:C[j].l<=e){fi=j;break}}\n  if(fi<0)return;const rr=(tp-e)/(e-sl);let ex=N-1,res=null;\n  for(let j=fi;j<N;j++){if(C[j].l<=sl){ex=j;res=-1;break}if(j>fi&&C[j].h>=tp){ex=j;res=rr;break}}\n  const open=res===null;if(open)res=(C[N-1].c-e)/(e-sl);\n  T.push({n:tr.n,e,sl,tp,rr,fi,ex,res,open})});\n const pad=.12*YR;return{C,N,T,WT,w,YMIN:mn-pad,YMAX:mx+pad};\n}\nlet sel=0,D=1,fail=false,tpi=0,S,STEPS=[],cur=0,timer=null,replaySeed=(Date.now()^Math.floor(Math.random()*0xffffffff))|0;\nfunction chips(){$('chips').innerHTML=PT.map((p,i)=>`<button class=\"${i===sel?'on':'g'}\" onclick=\"load(${i})\">${p.name}</button>`).join('')}\nfunction load(i){sel=i;tpi=PT[i].tpd||0;replaySeed=(Date.now()^Math.floor(Math.random()*0xffffffff))|0;rebuild()}\nfunction rebuild(){pause();const pt=PT[sel];S=sim(pt,fail,tpi,replaySeed);cur=0;\n $('dB').className=D>0?'on':'g';$('dS').className=D<0?'on':'g';$('oW').className=fail?'g':'on';$('oF').className=fail?'on':'g';\n $('tpl').style.display=pt.tpo?'':'none';if(pt.tpo)$('tps').innerHTML=pt.tpo.map((o,k)=>`<option value=\"${k}\" ${k===tpi?'selected':''}>${o[1]}</option>`).join('');\n const lg=D>0?'long':'short';\n STEPS=[[0,pt.name+' · '+(D>0?'bullish ▲':'bearish ▼')+(fail?' · pattern fails':''),pt.note+(fail?' In this version the structure invalidates after entry.':'')]];\n pt.st.forEach(s=>{if(fail&&s[0]>=pt.ff)return;STEPS.push([S.WT[s[0]],s[2],s[3]])});\n S.T.forEach(t=>{STEPS.push([t.fi,t.n+' · '+lg+' filled at '+fx(t.e),'SL '+fx(t.sl)+', TP '+fx(t.tp)+'. Risk '+fx(t.e-t.sl)+', reward '+fx(t.tp-t.e)+', <b>R:R 1:'+fx(t.rr,1)+'</b> '+(t.rr>=2?'<span class=\"pos\">✔ meets 1:2</span>':'<span class=\"neg\">✘ below 1:2, skip it</span>')+'.']);\n  STEPS.push([t.ex,t.n+(t.res<0?' · stopped out':t.open?' · still open':' · target hit'),t.res<0?'Price lost '+fx(t.sl)+' first. −1R, about −$10.':t.open?'Unresolved at the end of the path.':'TP '+fx(t.tp)+' reached. +'+fx(t.rr,1)+'R, about +$'+fx(t.rr*10,0)+'.'])});\n STEPS.sort((a,b)=>a[0]-b[0]);\n $('st').innerHTML='';STEPS.forEach((s,k)=>{const b=document.createElement('button');b.textContent=k+1;b.onclick=()=>{pause();cur=s[0];ui()};$('st').appendChild(b)});\n $('sc').max=S.N-1;chips();score();ui()}\nfunction score(){const rows=PT.map(pt=>{const a=sim(pt,false,pt.tpd||0),b=sim(pt,true,pt.tpd||0);const rr=a.T.reduce((s,t)=>s+t.rr,0)/a.T.length;const ra=a.T.reduce((s,t)=>s+t.res,0),rb=b.T.reduce((s,t)=>s+t.res,0);\n return `<tr><td>${pt.name}</td><td class=\"${rr>=2?'pos':'neg'}\">1 : ${fx(rr,1)}</td><td class=\"pos\">+${fx(ra,1)}R (${a.T.length} trade${a.T.length>1?'s':''})</td><td class=\"${rb>=0?'pos':'neg'}\">${rb>=0?'+':''}${fx(rb,1)}R (${b.T.length} filled)</td><td>${fx(100/(1+rr),0)}%</td></tr>`}).join('');$('sb').innerHTML=rows}\nfunction draw(){\nconst cv=$('cv'),d=devicePixelRatio||1,W=cv.clientWidth,Ht=cv.clientHeight;\nif(cv.width!==Math.round(W*d)){cv.width=Math.round(W*d);cv.height=Math.round(Ht*d)}\nconst x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,W,Ht);\nconst cs=getComputedStyle(document.documentElement),v=n=>cs.getPropertyValue(n).trim();\nconst pr=76,pl=6,tp=10,bt=10,pw=W-pr-pl,ph=Ht-tp-bt,{YMIN,YMAX,N,C,WT,w}=S,pt=PT[sel];\nconst y=f=>D>0?tp+(YMAX-f)/(YMAX-YMIN)*ph:tp+(f-YMIN)/(YMAX-YMIN)*ph,xi=i=>pl+(i+.5)/N*pw,bw=Math.max(2,pw/N*.62);\nx.textBaseline='middle';x.font='10px system-ui,sans-serif';\npt.bands.forEach(b=>{const a=y(b[0]),c=y(b[1]),top=Math.min(a,c),height=Math.max(1,Math.abs(a-c));x.fillStyle=v('--ac');x.globalAlpha=.24;x.fillRect(pl,top,pw,height);x.globalAlpha=.9;x.strokeStyle=v('--ac');x.lineWidth=2;x.strokeRect(pl,top,pw,height);x.globalAlpha=1;x.font='bold 11px system-ui,sans-serif';const labelY=Math.max(12,Math.min(Ht-12,top+12));x.fillStyle=v('--bg');x.fillRect(pl+4,labelY-8,Math.min(pw-8,b[2].length*6.7+10),16);x.fillStyle=v('--ac');x.fillText(b[2],pl+9,labelY)});\nconst fibLevels=pt.id==='ARCH'?[.618,1,1.41,1.618,2,2.23,4.23,5.6,6.82].map(n=>[L+u*n,n]):[.618,1,1.272,1.41,1.618,2,2.23,2.618,3.14,4.23,5.6,6.82,11.05].map(n=>[n,n]);\nx.font='bold 10px system-ui,sans-serif';fibLevels.forEach(([level,ratio])=>{if(level<S.YMIN||level>S.YMAX)return;const yy=y(level),major=[1,1.41,1.618,2,2.23,4.23,6.82].includes(ratio);x.strokeStyle=v('--ac');x.globalAlpha=major?.72:.42;x.lineWidth=major?1.5:1;x.setLineDash([4,4]);x.beginPath();x.moveTo(pl,yy);x.lineTo(pl+pw,yy);x.stroke();x.setLineDash([]);x.globalAlpha=1;x.fillStyle=v('--ac');x.fillText(ratio.toFixed(ratio%1===0?0:2),pl+pw+5,yy)});x.lineWidth=1;\nfor(let i=0;i<=cur;i++){const c=C[i],up=(c.c>=c.o)===(D>0);x.strokeStyle=x.fillStyle=up?v('--up'):v('--dn');\nx.beginPath();x.moveTo(xi(i),y(c.h));x.lineTo(xi(i),y(c.l));x.stroke();x.fillRect(xi(i)-bw/2,Math.min(y(c.o),y(c.c)),bw,Math.max(1.5,Math.abs(y(c.o)-y(c.c))))}\nx.font='bold 10px system-ui,sans-serif';\npt.st.forEach(s=>{if(fail&&s[0]>=pt.ff)return;const k=s[0];if(cur<S.WT[k])return;const f=w[k],pv=w[k-1]!==undefined?w[k-1]:f,nx=w[k+1]!==undefined?w[k+1]:f,top=f>=pv&&f>=nx;\n const sgn=(top===(D>0))?-1:1;x.fillStyle=v('--tx');x.fillText(s[1],xi(WT[k])+5,y(f)+sgn*11)});\nS.T.forEach(t=>{if(cur<t.fi)return;const x0=xi(t.fi),x1=xi(Math.min(cur,Math.max(t.ex,t.fi+4)));\n x.globalAlpha=.16;x.fillStyle=v('--up');x.fillRect(x0,Math.min(y(t.e),y(t.tp)),x1-x0,Math.abs(y(t.e)-y(t.tp)));x.fillStyle=v('--dn');x.fillRect(x0,Math.min(y(t.e),y(t.sl)),x1-x0,Math.abs(y(t.e)-y(t.sl)));x.globalAlpha=1;\n x.lineWidth=1.3;[[t.e,'--ok',[5,4],'E'],[t.sl,'--bad',[],'SL'],[t.tp,'--ac',[5,4],'TP']].forEach(L=>{x.strokeStyle=v(L[1]);x.setLineDash(L[2]);x.beginPath();x.moveTo(x0,y(L[0]));x.lineTo(x1,y(L[0]));x.stroke()});x.setLineDash([]);x.lineWidth=1;\n x.fillStyle=v('--ok');x.beginPath();x.arc(x0,y(t.e),4,0,7);x.fill();x.fillStyle=v('--tx');x.fillText(t.n+' 1:'+fx(t.rr,1),x1+5,y(t.tp));\n if(cur>=t.ex&&!t.open){const win=t.res>0;x.fillStyle=win?v('--ac'):v('--bad');x.beginPath();x.arc(xi(t.ex),y(win?t.tp:t.sl),4,0,7);x.fill();x.fillText(win?'+'+fx(t.rr,1)+'R':'−1R',xi(t.ex)+7,y(win?t.tp:t.sl)+(win?0:0))}});\nconst lp=C[cur].c;x.fillStyle=v('--tx');x.fillRect(pl+pw+2,y(lp)-8,pr-8,16);x.fillStyle=v('--bg');x.font='bold 11px system-ui,sans-serif';x.fillText(fx(lp),pl+pw+8,y(lp));\n}\nfunction ui(){\nlet si=0;STEPS.forEach((s,k)=>{if(s[0]<=cur)si=k});\n$('nt').textContent=STEPS[si][1];$('nb').innerHTML='<p>'+STEPS[si][2]+'</p>';\n$('st').querySelectorAll('button').forEach((b,k)=>b.className=k===si?'on':'g');$('sc').value=cur;\n$('h1').textContent=S.T.filter(t=>cur>=t.fi&&cur<t.ex).length;\nconst cl=S.T.filter(t=>cur>=t.ex&&!t.open),R=cl.reduce((a,t)=>a+t.res,0);$('h2').textContent=cl.length;$('h3').textContent=(R>=0?'+':'')+fx(R,1)+'R · '+(R>=0?'+':'−')+'$'+fx(Math.abs(R)*10,0);\n$('h4').textContent=S.T.length?'1 : '+fx(S.T.reduce((a,t)=>a+t.rr,0)/S.T.length,1):'—';\ndraw()}\nfunction pause(){clearInterval(timer);timer=null;$('pl').textContent='Play'}\nfunction play(){if(cur>=S.N-1)cur=0;$('pl').textContent='Pause';timer=setInterval(()=>{cur++;if(cur>=S.N-1){cur=S.N-1;pause()}else if($('ap').checked&&STEPS.some(s=>s[0]===cur))pause();ui()},480/(+$('sp').value))}\n$('pl').onclick=()=>timer?pause():play();\n$('nx').onclick=()=>{pause();const n=STEPS.find(s=>s[0]>cur);cur=n?n[0]:S.N-1;ui()};\n$('bk').onclick=()=>{pause();const p=STEPS.filter(s=>s[0]<cur).pop();cur=p?p[0]:0;ui()};\n$('rs').onclick=()=>{pause();cur=0;ui()};\n$('sc').oninput=e=>{pause();cur=+e.target.value;ui()};\n$('sp').oninput=()=>{if(timer){pause();play()}};\n$('dB').onclick=()=>{D=1;rebuild()};$('dS').onclick=()=>{D=-1;rebuild()};\n$('oW').onclick=()=>{fail=false;rebuild()};$('oF').onclick=()=>{fail=true;rebuild()};\n$('tps').onchange=e=>{tpi=+e.target.value;rebuild()};\naddEventListener('resize',()=>S&&draw());\nload(0);\n<\/script></body></html>\n"},{"name":"XAUUSD Institutional Intent Playbook.html","title":"XAUUSD Institutional Intent Playbook","html":"<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>XAUUSD Institutional Intent Playbook</title>\n<style>\n:root{--bg:#f6f4ef;--card:#fff;--fg:#1d1d1b;--mut:#6b6a63;--line:#dcd8cc;--up:#0f8a6d;--dn:#c8402f;--acc:#b8860b;--accbg:rgba(184,134,11,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#121211;--card:#1c1c1a;--fg:#ece9df;--mut:#9a978b;--line:#34332e;--up:#2fc79f;--dn:#ef6a58;--acc:#e0b040;--accbg:rgba(224,176,64,.16);color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg:#121211;--card:#1c1c1a;--fg:#ece9df;--mut:#9a978b;--line:#34332e;--up:#2fc79f;--dn:#ef6a58;--acc:#e0b040;--accbg:rgba(224,176,64,.16);color-scheme:dark}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif}\nmain{max-width:640px;margin:0 auto;padding:18px 16px 48px}\nh1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}\nh2{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--acc);margin:30px 0 10px}\np{margin:0 0 10px}.mut{color:var(--mut)}\n.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}\n.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}\n.chip{font-size:12px;padding:4px 9px;border-radius:99px;border:1px solid var(--line);background:var(--card)}\n.chip b{color:var(--acc)}\n.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}\nbutton{font:inherit;font-size:14px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}\nbutton.on{background:var(--acc);color:#fff;border-color:var(--acc)}\nbutton:disabled{opacity:.4}\n.sp{flex:1}\nsvg{width:100%;height:auto;display:block}\n.t{fill:var(--mut);font-size:9px}.tl{fill:var(--fg);font-size:10px;font-weight:600}\n.ex{min-height:66px;font-size:14px}.ex b{color:var(--acc)}\n.fp{font:12px/1.2 ui-monospace,Menlo,Consolas,monospace;margin-top:8px}\n.fr{display:grid;grid-template-columns:84px 1fr 14px 1fr;gap:4px;padding:3px 0;text-align:center;align-items:center}\n.fr span{text-align:left;color:var(--mut);font-size:11px}\n.fr b{padding:3px;border-radius:4px;font-weight:500;background:transparent}\n.fr b.h{background:var(--accbg);color:var(--acc);font-weight:700}\n.fr i{color:var(--mut);font-style:normal}\ntable{width:100%;border-collapse:collapse;font-size:14px}\ntd{padding:7px 4px;border-top:1px solid var(--line);vertical-align:top}\ntd:first-child{width:92px;font-weight:600;white-space:nowrap}\n.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n@media(max-width:480px){.g{grid-template-columns:1fr}}\nul{margin:6px 0 0;padding-left:18px}li{margin-bottom:4px}\n.ok h3{color:var(--up)}.no h3{color:var(--dn)}h3{margin:0 0 4px;font-size:14px}\nlabel.ck{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}\nlabel.ck:first-of-type{border-top:0}\ninput[type=checkbox]{width:20px;height:20px;margin-top:1px;accent-color:var(--acc)}\ninput[type=text],select{width:100%;font:inherit;font-size:14px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}\n.ln{margin-bottom:10px}.ln small{display:block;color:var(--mut);margin-bottom:3px;font-size:12px}\n#status{padding:12px;border-radius:10px;font-weight:700;text-align:center;margin-top:6px}\n#status.no{background:rgba(200,64,47,.14);color:var(--dn)}#status.go{background:rgba(15,138,109,.16);color:var(--up)}\n#miss{font-size:12px;font-weight:400;margin-top:4px}\n</style></head><body><main>\n\n<h1>Institutional Intent · XAUUSD</h1>\n<p class=\"mut\">Don’t trade price. Trade the auction. Wait for institutions to show intent on the footprint, then join after the trap.</p>\n<div class=\"chips\"><span class=\"chip\"><b>1</b> Context</span><span class=\"chip\"><b>2</b> Level</span><span class=\"chip\"><b>3</b> Trigger</span><span class=\"chip\"><b>4</b> Entry</span><span class=\"chip\"><b>5</b> SL</span><span class=\"chip\"><b>6</b> TP1/TP2</span><span class=\"chip\"><b>7</b> Invalidation</span></div>\n\n<h2>The setup, replayed</h2>\n<div class=\"card\">\n<div class=\"row\"><button id=\"bS\" class=\"on\">Short</button><button id=\"bL\">Long</button><span class=\"sp\"></span><button id=\"pv\">‹</button><button id=\"nx\">Next ›</button></div>\n<svg id=\"ch\" viewBox=\"0 0 360 300\" role=\"img\" aria-label=\"Setup replay chart\"></svg>\n<div id=\"ex\" class=\"ex\"></div>\n<div id=\"fp\" class=\"fp\"></div>\n</div>\n<p class=\"mut\" style=\"font-size:12px\">Illustrative geometry, not real price data. Long = the same picture mirrored.</p>\n\n<h2>1 · Higher-timeframe context</h2>\n<div class=\"card\"><table>\n<tr><td>Structure</td><td>1H BOS / MSB, consolidation, prior high / low.</td></tr>\n<tr><td>Magnets</td><td>Unfinished auctions and single prints. Price wants to revisit them. They become TP1.</td></tr>\n<tr><td>Programs</td><td>Stacked imbalances mark where programs were active. They become TP2.</td></tr>\n<tr><td>Gate</td><td><b>No HTF level = no trade.</b></td></tr></table></div>\n\n<h2>2 · The four-part trigger (all or nothing)</h2>\n<div class=\"card\"><table>\n<tr><td>① Sweep</td><td>Price runs the prior high / low into your HTF level.</td></tr>\n<tr><td>② Absorption</td><td>Heavy volume at the sweep, price does not continue. Aggressors absorbed.</td></tr>\n<tr><td>③ Delta shift</td><td>Delta flips against the sweep direction. Institutions changed sides.</td></tr>\n<tr><td>④ Retest</td><td>Price returns to the absorption candle / level.</td></tr></table>\n<p class=\"mut\" style=\"margin:8px 0 0\">Only after London open. Three of four is not a setup.</p></div>\n\n<h2>3 · Entry, stop, targets</h2>\n<div class=\"card\"><table>\n<tr><td>Entry</td><td>On the retest of the absorption zone. Never on the sweep itself.</td></tr>\n<tr><td>SL</td><td>Beyond the absorption candle. If it breaks, the thesis is dead: exit.</td></tr>\n<tr><td>TP1</td><td>Next unfinished auction / single print.</td></tr>\n<tr><td>TP2</td><td>Next stacked imbalance / HTF level.</td></tr></table>\n<p id=\"rr\" class=\"mut\" style=\"margin:8px 0 0\"></p></div>\n\n<h2>4 · Execution rules</h2>\n<div class=\"g\">\n<div class=\"card ok\"><h3>Do</h3><ul><li>Trade the active contract / session only</li><li>One setup, one entry</li><li>Write the 5 lines before clicking</li></ul></div>\n<div class=\"card no\"><h3>Never</h3><ul><li>Carry a stale rollover bias</li><li>Chase, or re-enter after invalidation</li><li>Average or flip if price accepts beyond the absorption candle</li></ul></div>\n</div>\n\n<h2>Pre-trade checklist · live</h2>\n<div class=\"card\">\n<label class=\"ck\"><input type=\"checkbox\" data-k=\"c0\"><span>London open has passed</span></label>\n<label class=\"ck\"><input type=\"checkbox\" data-k=\"c1\"><span><b>Sweep</b> into HTF level</span></label>\n<label class=\"ck\"><input type=\"checkbox\" data-k=\"c2\"><span><b>Absorption</b> on footprint</span></label>\n<label class=\"ck\"><input type=\"checkbox\" data-k=\"c3\"><span><b>Delta</b> flipped against sweep</span></label>\n<label class=\"ck\"><input type=\"checkbox\" data-k=\"c4\"><span><b>Retest</b> of absorption zone</span></label>\n</div>\n<div class=\"card\">\n<div class=\"ln\"><small>1 · HTF level</small><input type=\"text\" data-k=\"f1\" placeholder=\"e.g. 1H prior high\"></div>\n<div class=\"ln\"><small>2 · Sweep + absorption?</small><select data-k=\"f2\"><option value=\"\">—</option><option>Yes</option><option>No</option></select></div>\n<div class=\"ln\"><small>3 · Delta shift?</small><select data-k=\"f3\"><option value=\"\">—</option><option>Yes</option><option>No</option></select></div>\n<div class=\"ln\"><small>4 · Entry on retest</small><input type=\"text\" data-k=\"f4\" placeholder=\"price\"></div>\n<div class=\"ln\"><small>5 · Invalidation</small><input type=\"text\" data-k=\"f5\" placeholder=\"price\"></div>\n<div id=\"status\" class=\"no\">NO TRADE<div id=\"miss\"></div></div>\n<div class=\"row\" style=\"margin:10px 0 0\"><button id=\"rs\">Reset</button></div>\n</div>\n</main>\n<script>\nvar C=[[50,56,58,49],[56,60,62,55],[60,58,63,57],[58,62,64,57],[62,63,70,61],[62,55,63,54],[55,52,56,51],[56,61,64,55],[61,54,62,53],[54,46,55,45],[46,40,47,39]];\nvar D=[5,8,-2,10,30,-25,-12,6,-18,-22,-15],MS=[0,0,0,0,1,3,3,4,5,5,5];\nvar ENTRY=63,SL=70.5,TP1=45,TP2=35,dir=\"short\",step=0;\nvar TX=[\"<b>Start.</b> HTF level is marked at the dashed line. Price is drifting into it. Nothing to do yet.\",\n\"<b>① Sweep.</b> Price runs the prior high and tags the HTF level. This is bait, not a signal.\",\n\"<b>② Absorption.</b> Heavy volume at the extreme, but price cannot continue. Aggressive buyers are being absorbed. The shaded zone is your level.\",\n\"<b>③ Delta shift.</b> Delta was strongly positive on the sweep, then flips negative. Confirmation that institutions changed sides.\",\n\"<b>④ Retest.</b> Price returns to the absorption zone. This is the only place you enter.\",\n\"<b>Trade.</b> Entry on retest, SL beyond the absorption candle, TP1 at the single print, TP2 at the stacked imbalance.\"];\nvar FP=[[\"Wick high\",8,95],[\"HTF zone\",22,260],[\"Sweep\",40,310],[\"Prior high\",120,180],[\"Body\",150,90],[\"Close\",160,60]];\nfunction $(i){return document.getElementById(i)}\nfunction Y(v){return 10+(75-(dir===\"short\"?v:105-v))/45*200}\nfunction X(i){return 18+i*28}\nfunction op(m){return 'style=\"opacity:'+(step>=m?1:0)+';transition:opacity .35s\"'}\nfunction draw(){\nvar s=\"\",i,c,up,col,d,h;\nvar lv=[[68,\"HTF level\",\"var(--acc)\"],[64,\"Prior high\",\"var(--mut)\"]];\nif(dir===\"long\")lv[1][1]=\"Prior low\";\nlv.forEach(function(l){s+='<line x1=\"0\" x2=\"360\" y1=\"'+Y(l[0])+'\" y2=\"'+Y(l[0])+'\" stroke=\"'+l[2]+'\" stroke-dasharray=\"4 3\" opacity=\".7\"/><text class=\"t\" x=\"2\" y=\"'+(Y(l[0])-3)+'\">'+l[1]+'</text>'});\ns+='<g '+op(2)+'><rect x=\"'+(X(4)-9)+'\" y=\"'+Math.min(Y(70),Y(62))+'\" width=\"'+(X(8)-X(4)+18)+'\" height=\"'+Math.abs(Y(62)-Y(70))+'\" fill=\"var(--acc)\" opacity=\".16\"/></g>';\nfor(i=0;i<C.length;i++){c=C[i];\n up=dir===\"short\"?c[1]>c[0]:c[1]<c[0];col=up?\"var(--up)\":\"var(--dn)\";\n s+='<g '+op(MS[i])+'><line x1=\"'+X(i)+'\" x2=\"'+X(i)+'\" y1=\"'+Y(c[2])+'\" y2=\"'+Y(c[3])+'\" stroke=\"'+col+'\" stroke-width=\"1.5\"/><rect x=\"'+(X(i)-6)+'\" y=\"'+Math.min(Y(c[0]),Y(c[1]))+'\" width=\"12\" height=\"'+Math.max(2,Math.abs(Y(c[0])-Y(c[1])))+'\" fill=\"'+col+'\"/>';\n d=dir===\"short\"?D[i]:-D[i];h=Math.min(34,Math.abs(d)*1.1);\n s+='<rect x=\"'+(X(i)-6)+'\" y=\"'+(d>=0?262-h:262)+'\" width=\"12\" height=\"'+h+'\" fill=\"'+(d>=0?\"var(--up)\":\"var(--dn)\")+'\" opacity=\".75\"/></g>'}\ns+='<line x1=\"0\" x2=\"360\" y1=\"262\" y2=\"262\" stroke=\"var(--line)\"/><text class=\"t\" x=\"2\" y=\"226\">Delta per candle</text>';\nvar o=dir===\"short\"?-13:13;\nfunction mk(m,x,y,n){return '<g '+op(m)+'><circle cx=\"'+x+'\" cy=\"'+y+'\" r=\"8\" fill=\"var(--acc)\"/><text x=\"'+x+'\" y=\"'+(y+3.5)+'\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#fff\">'+n+'</text></g>'}\ns+=mk(1,X(4)-17,Y(70)+(dir===\"short\"?-2:2),\"1\")+mk(2,X(4)+19,Y(66),\"2\")+mk(3,X(5),dir===\"short\"?276:246,\"3\")+mk(4,X(7),Y(64)+o,\"4\");\ns+='<g '+op(5)+'>';\n[[ENTRY,\"Entry\",\"var(--fg)\"],[SL,\"SL\",\"var(--dn)\"],[TP1,\"TP1\",\"var(--up)\"],[TP2,\"TP2\",\"var(--up)\"]].forEach(function(l){\n s+='<line x1=\"'+X(7)+'\" x2=\"'+(X(10)+14)+'\" y1=\"'+Y(l[0])+'\" y2=\"'+Y(l[0])+'\" stroke=\"'+l[2]+'\" stroke-width=\"1.5\"/><text class=\"tl\" x=\"'+(X(10)+18)+'\" y=\"'+(Y(l[0])+3)+'\" style=\"fill:'+l[2]+'\">'+l[1]+'</text>'});\ns+='</g>';\n$(\"ch\").innerHTML=s;\n$(\"ex\").innerHTML=TX[step];\n$(\"nx\").disabled=step>=5;$(\"pv\").disabled=step<=0;$(\"nx\").textContent=step>=5?\"Done\":\"Next ›\";\nvar rows=FP.map(function(r){return dir===\"short\"?r:null});\nif(dir===\"long\"){rows=FP.slice().reverse().map(function(r){return [r[0].replace(\"high\",\"low\"),r[2],r[1]]})}\nvar f='<div class=\"mut\" style=\"margin-bottom:4px\">Footprint of the sweep candle · bid × ask</div>';\nrows.forEach(function(r){f+='<div class=\"fr\"><span>'+r[0]+'</span><b class=\"'+(r[1]>=200?\"h\":\"\")+'\">'+r[1]+'</b><i>×</i><b class=\"'+(r[2]>=200?\"h\":\"\")+'\">'+r[2]+'</b></div>'});\nf+='<div class=\"mut\" style=\"margin-top:6px\">Heavy '+(dir===\"short\"?\"ask\":\"bid\")+' volume at the extreme, no follow-through = absorption.</div>';\n$(\"fp\").innerHTML=step>=2?f:\"\";\nvar rk=Math.abs(SL-ENTRY);\n$(\"rr\").textContent=\"Illustrated replay: risk \"+rk.toFixed(1)+\" units → TP1 \"+(Math.abs(ENTRY-TP1)/rk).toFixed(1)+\"R, TP2 \"+(Math.abs(ENTRY-TP2)/rk).toFixed(1)+\"R. Targets are set by the chart, never by the R you want.\";\n$(\"bS\").className=dir===\"short\"?\"on\":\"\";$(\"bL\").className=dir===\"long\"?\"on\":\"\";\n}\n$(\"bS\").onclick=function(){dir=\"short\";draw()};$(\"bL\").onclick=function(){dir=\"long\";draw()};\n$(\"nx\").onclick=function(){if(step<5){step++;draw()}};$(\"pv\").onclick=function(){if(step>0){step--;draw()}};\ndraw();\n/* checklist */\nvar st={},els=document.querySelectorAll(\"[data-k]\");\ntry{st=JSON.parse(localStorage.getItem(\"xau-intent\")||\"{}\")||{}}catch(e){st={}}\nfunction save(){try{localStorage.setItem(\"xau-intent\",JSON.stringify(st))}catch(e){}}\nfunction ev(){\nvar m=[],names={c0:\"London open\",c1:\"sweep\",c2:\"absorption\",c3:\"delta shift\",c4:\"retest\",f1:\"HTF level\",f4:\"entry\",f5:\"invalidation\"};\n[\"c0\",\"c1\",\"c2\",\"c3\",\"c4\"].forEach(function(k){if(!st[k])m.push(names[k])});\n[\"f1\",\"f4\",\"f5\"].forEach(function(k){if(!(st[k]||\"\").trim())m.push(names[k])});\nif(st.f2!==\"Yes\")m.push(\"sweep + absorption = Yes\");\nif(st.f3!==\"Yes\")m.push(\"delta shift = Yes\");\nvar s=$(\"status\");\nif(m.length){s.className=\"no\";s.innerHTML='NO TRADE<div id=\"miss\">Missing: '+m.join(\", \")+'</div>'}\nelse{s.className=\"go\";s.innerHTML='SETUP VALID<div id=\"miss\">One setup, one entry. No chasing.</div>'}}\nels.forEach(function(e){var k=e.dataset.k;\n if(e.type===\"checkbox\")e.checked=!!st[k];else e.value=st[k]||\"\";\n e.onchange=e.oninput=function(){st[k]=e.type===\"checkbox\"?e.checked:e.value;save();ev()}});\n$(\"rs\").onclick=function(){st={};save();els.forEach(function(e){if(e.type===\"checkbox\")e.checked=false;else e.value=\"\"});ev()};\nev();\n<\/script></body></html>\n"}];const tabs=document.getElementById('tabs'),view=document.getElementById('view');pages.forEach((page,index)=>{const b=document.createElement('button');b.className='tab';b.type='button';b.role='tab';b.id='tab-'+index;b.setAttribute('aria-controls','view');b.setAttribute('aria-selected',index===0?'true':'false');b.tabIndex=index===0?0:-1;b.textContent=page.title||page.name.replace(/\.html$/i,'');b.onclick=()=>show(index);tabs.appendChild(b)});function show(index){[...tabs.children].forEach((b,i)=>{b.setAttribute('aria-selected',i===index?'true':'false');b.tabIndex=i===index?0:-1});view.title=pages[index].title||pages[index].name;view.srcdoc=pages[index].html}tabs.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();let i=[...tabs.children].indexOf(document.activeElement);if(e.key==='ArrowLeft')i=(i+pages.length-1)%pages.length;else if(e.key==='ArrowRight')i=(i+1)%pages.length;else if(e.key==='Home')i=0;else i=pages.length-1;tabs.children[i].focus();show(i)});show(0);
</script></body></html>
