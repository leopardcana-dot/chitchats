  <style>
    * { box-sizing: border-box; }

    @keyframes shimmer { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }

    .animate-fade-up { animation: fadeUp 0.4s ease-out; }
    .animate-spin-slow { animation: spin-slow 8s linear infinite; }
    .animate-pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }

      background: linear-gradient(90deg, #c9a84c 0%, #e8c97a 40%, #fff8dc 50%, #e8c97a 60%, #c9a84c 100%);

// ==================== COMPONENTS ====================
const suitClass = (suit) => {
  if (suit==='major') return 'major-card';
  if (suit==='wands') return 'wands-card';
  if (suit==='cups') return 'cups-card';
  if (suit==='swords') return 'swords-card';
  return 'pentacles-card';
};

const suitColor = (suit) => {
  if (suit==='major') return '#a78bfa';
  if (suit==='wands') return '#fb923c';
  if (suit==='cups') return '#60a5fa';
  if (suit==='swords') return '#94a3b8';
  return '#4ade80';
};

const TarotCard = ({ card, isReversed=false, size='md', onClick, isRevealed=true }) => {
  const sizes = { sm:'w-14 h-22', md:'w-20 h-32', lg:'w-24 h-40', xl:'w-28 h-44' };
  const textSz = { sm:'text-xl', md:'text-2xl', lg:'text-3xl', xl:'text-4xl' };
  const nameSz = { sm:'text-[7px]', md:'text-[9px]', lg:'text-[10px]', xl:'text-xs' };
  if (!card) return (
    <div className={`w-20 h-32 rounded-lg border-2 border-dashed border-amber-800/40 flex items-center justify-center`}
         style={{background:'linear-gradient(135deg,#1a0a2e,#0f051e)'}}>
      <span className="text-amber-800/40 text-xl">✦</span>
    </div>
  );
  return (
    <div className={`w-20 h-32 rounded-xl cursor-pointer transition-all duration-300 relative group gold-border card-glow ${isRevealed?'animate-card-reveal':''} ${suitClass(card.suit)}`}
         style={{border:`1px solid ${suitColor(card.suit)}40`, minWidth:'80px'}}
         onClick={()=>onClick&&onClick(card,isReversed)}>
      <div className="absolute top-1 left-1 font-cinzel text-[8px]" style={{color:`${suitColor(card.suit)}60`}}>{card.num}</div>
      <div className="absolute top-1 right-1 text-[8px]" style={{color:`${suitColor(card.suit)}50`}}>✦</div>
      <div className={`flex flex-col items-center justify-center h-full pb-1 ${isReversed?'scale-y-[-1]':''}`}>
        <span className={`${textSz['md']} drop-shadow-lg`}>{card.symbol}</span>
        <span className={`font-cinzel text-center px-1 mt-1 leading-tight ${nameSz['md']}`} style={{color:`${suitColor(card.suit)}cc`}}>{card.name}</span>
        {isReversed && <span className="text-[7px] font-cinzel text-amber-500/80 mt-0.5" style={{transform:'scaleY(-1)'}}>↺ rv</span>}
      </div>
      <div className="absolute bottom-1 left-2 right-2 h-px" style={{background:`linear-gradient(to right, transparent, ${suitColor(card.suit)}40, transparent)`}} />
    </div>
  );
};

const SpreadLayout = ({spread,cards,reversedFlags,onCardClick}) => {
  if (!spread) return null;
  const fullCards = Array.from({length:spread.cardCount},(_,i)=>cards[i]?{...cards[i],reversedFlag:reversedFlags?.[i]||false}:null);
  const props = {cards:fullCards,positions:spread.positions,onCardClick};
  switch(spread.id) {
    case 'single': return <SingleLayout {...props}/>;
    case 'three': return <ThreeLayout {...props}/>;

    default: return <ThreeLayout {...props}/>;

// ==================== AI INTERPRETATION ====================
const InterpretationPanel = ({spread,cards,question,reversedFlags}) => {
  const [text,setText] = React.useState('');
  const [loading,setLoading] = React.useState(false);
  const [done,setDone] = React.useState(false);
  const [hasStarted,setHasStarted] = React.useState(false);
  const allDrawn = cards.filter(Boolean).length===spread?.cardCount;

  const getReading = async () => {
    setLoading(true); setHasStarted(true); setText('');
    const cardDescriptions = cards.map((c,i)=>{
      const isRev = reversedFlags?.[i]||false;
      return `Position ${i+1} (${spread.positions[i]}): ${c.name} (${c.suit}, ${c.num})${isRev?' — REVERSED':''} — ${isRev?c.reversed:c.upright} | Keywords: ${c.keywords.join(', ')} | Element: ${c.element} | Planet: ${c.planet}`;
    }).join('\n');
    const prompt = `You are a masterful Tarot reader with deep esoteric knowledge. Provide an eloquent, insightful, mystical yet grounded reading.

Spread: ${spread.name}
${question?`Seeker's question: "${question}"`:'No specific question — provide a general life reading.'}

Cards drawn:
${cardDescriptions}

Provide a reading with these sections:
1. **Opening Invocation** — Set the mystical scene (2 sentences)
2. **Card by Card Wisdom** — For each card, provide the position name in bold, then 2-3 sentences of deep interpretation connecting to the spread context
3. **The Weave** — How the cards interrelate, patterns, elemental dynamics (3-4 sentences)
4. **Oracle's Final Word** — A powerful closing guidance paragraph with an affirmation

Write in flowing, poetic yet clear prose. Use mystical but accessible language. Be specific and insightful, not vague. Total length: approximately 400-500 words.`;

    try {
      const resp = await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          model:'claude-sonnet-4-20250514',
          max_tokens:1000,
          stream:true,
          messages:[{role:'user',content:prompt}]
        })
      });
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf='';
      while(true){
        const {done:d,value}=await reader.read();
        if(d)break;
        buf+=decoder.decode(value,{stream:true});
        const lines=buf.split('\n');
        buf=lines.pop()||'';
        for(const line of lines){
          if(line.startsWith('data: ')){
            const data=line.slice(6).trim();
            if(data==='[DONE]')continue;
            try{
              const obj=JSON.parse(data);
              if(obj.type==='content_block_delta'&&obj.delta?.type==='text_delta'){
                setText(prev=>prev+obj.delta.text);
              }
            }catch{}
          }
        }
      }
    } catch(e) {
      setText('The oracle speaks through a veil... The cards whisper their ancient wisdom. Please check your connection and try again.');
    }
    setLoading(false); setDone(true);
  };

  const formatText = (raw) => {
    if (!raw) return '';
    return raw
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/\n\n/g,'</p><p>')
      .replace(/\n/g,'<br/>');
  };

  return (
    <div className="mt-6">
      {!hasStarted && allDrawn && (
        <div className="flex justify-center">
          <button onClick={getReading} className="relative group px-8 py-4 rounded-xl font-cinzel text-base tracking-widest uppercase transition-all duration-300 overflow-hidden animate-pulse-glow"
            style={{background:'linear-gradient(135deg,#7c3aed,#4c1d95)',border:'1px solid rgba(201,168,76,0.5)',color:'#e8c97a'}}>
            <span className="relative z-10">✦ Invoke the Oracle's Wisdom ✦</span>
          </button>
        </div>
      )}
      {loading && !text && (
        <div className="flex flex-col items-center gap-4 py-8">
          <div className="relative w-16 h-16">
            <div className="absolute inset-0 rounded-full border-2 border-amber-600/30 animate-spin-slow"/>
            <div className="absolute inset-2 rounded-full border border-amber-500/50 animate-spin-slow" style={{animationDirection:'reverse'}}/>
            <div className="absolute inset-0 flex items-center justify-center text-2xl">🔮</div>
          </div>
          <p className="font-cinzel text-amber-400/70 text-sm animate-pulse">The oracle reads the cosmic tapestry...</p>
        </div>
      )}
      {(text || done) && (
        <div className="animate-fade-up">
          <div className="flex items-center gap-3 mb-6">
            <div className="flex-1 h-px bg-gradient-to-r from-transparent via-amber-700/50 to-transparent"/>
            <span className="font-cinzel-deco text-amber-400/80 text-sm tracking-widest">✦ Oracle Speaks ✦</span>
            <div className="flex-1 h-px bg-gradient-to-r from-transparent via-amber-700/50 to-transparent"/>
          </div>
          <div className="rounded-2xl p-6 md:p-8 relative overflow-hidden" style={{background:'linear-gradient(135deg,rgba(45,27,78,0.8),rgba(26,10,46,0.9))',border:'1px solid rgba(201,168,76,0.2)'}}>
            <div className={`prose-mystical font-garamond text-amber-100/90 text-lg leading-relaxed ${!done?'streaming-cursor':''}`}>
              <p dangerouslySetInnerHTML={{__html:formatText(text)}}/>
            </div>
          </div>
          {done && (
            <div className="flex justify-center mt-4">
              <button onClick={getReading} className="border border-amber-700/40 px-5 py-2 rounded-full font-cinzel text-xs text-amber-500/70 hover:text-amber-400 hover:border-amber-600/50 transition">
                ↺ Request Another Reading
              </button>
            </div>
          )}
        </div>
      )}
    </div>
  );
};

const StarField = () => {
  const stars = React.useMemo(()=>Array.from({length:80},(_,i)=>({id:i,top:`${Math.random()*100}%`,left:`${Math.random()*100}%`,size:Math.random()*2+1,delay:Math.random()*4,duration:2+Math.random()*3})),[]);
  return (
    <div className="fixed inset-0 pointer-events-none z-0 overflow-hidden">
      <div className="orb w-96 h-96 -top-20 -left-20 bg-purple-900" style={{animationDelay:'0s'}}/>
      <div className="orb w-80 h-80 top-1/3 -right-20 bg-indigo-950" style={{animationDelay:'2s'}}/>
      <div className="orb w-64 h-64 bottom-0 left-1/3 bg-violet-950" style={{animationDelay:'4s'}}/>
      {stars.map(star=>(
        <div key={star.id} className="absolute rounded-full bg-amber-100"
          style={{top:star.top,left:star.left,width:star.size,height:star.size,animation:`starTwinkle ${star.duration}s ease-in-out ${star.delay}s infinite`,opacity:0.4}}/>

  );
};

  const [modalCard,setModalCard] = React.useState(null);
  const [isShuffling,setIsShuffling] = React.useState(false);
  const [galleryFilter,setGalleryFilter] = React.useState('all');
  const [pairA,setPairA] = React.useState(null);
  const [pairB,setPairB] = React.useState(null);

  React.useEffect(()=>{
    try{const s=localStorage.getItem('tarot78_v1');if(s)setReadingHistory(JSON.parse(s));}catch{}
  },[]);

  const shuffle = arr=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

  const drawCards = async () => {
    setIsShuffling(true);
    await new Promise(r=>setTimeout(r,700));
    const shuf = shuffle(TAROT_CARDS);
    const sel = shuf.slice(0,selectedSpread.cardCount);
    setDrawnCards(sel);
    setReversedFlags(sel.map(()=>useReversed?Math.random()<0.3:false));
    setIsShuffling(false);
  };

  const resetReading = ()=>{setDrawnCards([]);setQuestion('');};
  const saveReading = ()=>{
    if(!drawnCards.length)return;
    const r={id:Date.now(),date:new Date().toLocaleString(),spreadName:selectedSpread.name,spreadId:selectedSpread.id,cardIds:drawnCards.map(c=>c.id),reversedState:reversedFlags,question};
    const upd=[r,...readingHistory.slice(0,9)];
    setReadingHistory(upd);
    try{localStorage.setItem('tarot78_v1',JSON.stringify(upd));}catch{}
  };
  const loadReading = rec=>{
    const loaded=rec.cardIds.map(id=>TAROT_CARDS.find(c=>c.id===id)).filter(Boolean);
    if(loaded.length){setDrawnCards(loaded);setReversedFlags(rec.reversedState||[]);setQuestion(rec.question||'');const found=SPREADS.find(s=>s.id===rec.spreadId)||SPREADS[0];setSelectedSpread(found);setView('reading');}
  };
  const startReading = spread=>{setSelectedSpread(spread);setDrawnCards([]);setQuestion('');setView('reading');};

  const pairInsight = ()=>{
    if(!pairA||!pairB)return 'Select two cards to explore their synergy.';
    return `✦ ${pairA.name} & ${pairB.name} ✦ — The ${pairA.element} of ${pairA.name} meets the ${pairB.element} of ${pairB.name}. ${pairA.keywords[0]} intertwines with ${pairB.keywords[0]}, suggesting ${pairA.archetype} and ${pairB.archetype} in dialogue.`;
  };

  const filteredCards = galleryFilter==='all'?TAROT_CARDS:TAROT_CARDS.filter(c=>c.suit===galleryFilter);

  return (
    <div className="min-h-screen relative" style={{background:'linear-gradient(180deg,#0f0520 0%,#1a0a2e 50%,#12041e 100%)'}}>
      <StarField/>
      <div className="relative z-10">
        {/* HEADER */}
        <header className="border-b border-amber-800/20 bg-black/20 backdrop-blur-sm sticky top-0 z-40">
          <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <button onClick={()=>setView('home')} className="flex items-center gap-2 group">
              <span className="text-2xl group-hover:animate-float">🔮</span>
              <div className="text-left">
                <div className="font-cinzel-deco text-amber-300 text-sm md:text-base shimmer-text">The Tarot Oracle</div>
                <div className="font-garamond text-amber-700/60 text-xs hidden md:block">78 cards · Ancient wisdom</div>
              </div>
            </button>
            <nav className="flex gap-1">
              {['home','gallery'].map(v=>(
                <button key={v} onClick={()=>setView(v)} className={`font-cinzel text-xs tracking-widest px-3 py-1.5 rounded-lg capitalize ${view===v?'text-amber-300 bg-amber-900/30 border border-amber-700/40':'text-amber-600/70 hover:text-amber-400/80'}`}>{v==='home'?'Readings':v}</button>
              ))}
            </nav>
          </div>
        </header>

        {/* HOME */}
        {view==='home' && (
          <div className="max-w-5xl mx-auto px-4 py-12">
            <div className="text-center mb-14">
              <div className="text-6xl mb-4 animate-float">🔮</div>
              <h1 className="font-cinzel-deco text-3xl md:text-5xl shimmer-text mb-2">The Tarot Oracle</h1>
              <p className="font-garamond text-amber-200/60 text-xl italic">78 sacred cards · Illuminate your path through the mystic veil</p>
              <div className="flex justify-center gap-3 mt-6">
                <div className="h-px w-24 bg-gradient-to-r from-transparent to-amber-700/50"/>
                <span className="text-amber-600/50 font-cinzel text-xs tracking-widest">CHOOSE YOUR SPREAD</span>
                <div className="h-px w-24 bg-gradient-to-l from-transparent to-amber-700/50"/>
              </div>
            </div>

            {/* Spread Selector */}
            <div className="grid grid-cols-2 md:grid-cols-5 gap-3 mb-10">
              {SPREADS.map(s=>(
                <button key={s.id} onClick={()=>setSelectedSpread(s)} className={`p-4 rounded-xl text-left transition ${selectedSpread?.id===s.id?'border border-amber-500/70 bg-amber-900/30':'border border-amber-800/40 bg-purple-950/40 hover:bg-purple-900/50'}`}>
                  <div className="text-2xl">{s.icon}</div>
                  <div className="font-cinzel text-amber-300 text-sm mt-1">{s.name}</div>
                  <div className="text-amber-400/60 text-xs">{s.cardCount} cards</div>
                  <div className="text-amber-500/40 text-xs italic">{s.description}</div>
                </button>
              ))}
            </div>

            <div className="flex justify-center">
              <button onClick={()=>startReading(selectedSpread)} className="group relative px-10 py-5 rounded-2xl font-cinzel text-lg tracking-widest overflow-hidden transition-all animate-pulse-glow"
                style={{background:'linear-gradient(135deg,#4c1d95,#2d1b4e)',border:'1px solid rgba(201,168,76,0.5)',color:'#e8c97a',boxShadow:'0 0 30px rgba(124,58,237,0.25)'}}>
                <span className="relative z-10">✦ Begin {selectedSpread?.name} Reading ✦</span>
              </button>
            </div>

            {/* Tools */}
            <div className="grid md:grid-cols-2 gap-6 mt-16">
              <div className="bg-black/30 rounded-xl p-5 gold-border">
                <h3 className="font-cinzel text-amber-400 text-sm mb-3">🔗 Card Pair Alchemy</h3>
                <div className="flex gap-2 flex-wrap mb-3">
                  <select onChange={e=>setPairA(TAROT_CARDS.find(c=>c.id==e.target.value))} className="flex-1 border border-amber-700/50 p-2 rounded text-sm font-garamond">
                    <option value="">Card A...</option>
                    {TAROT_CARDS.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                  </select>
                  <select onChange={e=>setPairB(TAROT_CARDS.find(c=>c.id==e.target.value))} className="flex-1 border border-amber-700/50 p-2 rounded text-sm font-garamond">
                    <option value="">Card B...</option>
                    {TAROT_CARDS.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                  </select>
                </div>
                <p className="text-amber-200/80 text-sm italic font-garamond">{pairInsight()}</p>
              </div>

              <div className="bg-black/30 rounded-xl p-5 gold-border">
                <h3 className="font-cinzel text-amber-400 text-sm mb-3">📜 Suit Guide</h3>
                {[['major','#a78bfa','Major Arcana','Life\'s great archetypes & soul lessons'],['wands','#fb923c','Wands','Fire · Passion, action, creativity'],['cups','#60a5fa','Cups','Water · Emotions, relationships, intuition'],['swords','#94a3b8','Swords','Air · Mind, conflict, truth'],['pentacles','#4ade80','Pentacles','Earth · Material, work, abundance']].map(([s,col,name,desc])=>(
                  <div key={s} className="flex items-start gap-2 mb-2">
                    <div className="w-2 h-2 rounded-full mt-1.5 flex-shrink-0" style={{background:col}}/>
                    <div><span className="font-cinzel text-xs" style={{color:col}}>{name}</span><span className="text-amber-500/50 text-xs"> — {desc}</span></div>
                  </div>
                ))}
              </div>
            </div>

            {/* History */}
            {readingHistory.length>0 && (
              <div className="mt-8 border-t border-amber-800/40 pt-5">
                <h3 className="font-cinzel text-amber-400 text-sm tracking-widest mb-3">📜 PAST READINGS</h3>
                <div className="flex flex-wrap gap-2">
                  {readingHistory.map((item,idx)=>(
                    <button key={idx} onClick={()=>loadReading(item)} className="bg-purple-900/50 border border-amber-700/40 px-3 py-1 rounded-full text-xs font-cinzel hover:bg-amber-800/30 transition">
                      {item.date} · {item.spreadName}
                    </button>
                  ))}
                </div>
              </div>
            )}
          </div>
        )}

        {/* READING */}
        {view==='reading' && selectedSpread && (
          <div className="max-w-5xl mx-auto px-4 py-8">
            <div className="flex items-center gap-2 text-amber-700/50 font-cinzel text-xs mb-6">
              <button onClick={()=>setView('home')} className="hover:text-amber-500">Readings</button>
              <span>›</span><span className="text-amber-500/70">{selectedSpread.name}</span>
            </div>
            <div className="flex items-center gap-4 mb-6">
              <div className="text-3xl">{selectedSpread.icon}</div>
              <div>
                <h2 className="font-cinzel-deco text-amber-300 text-xl md:text-2xl">{selectedSpread.name}</h2>
                <p className="font-garamond text-amber-500/60 text-sm italic">{selectedSpread.description} · {selectedSpread.cardCount} cards</p>
              </div>
            </div>
            <div className="mb-5 rounded-xl overflow-hidden" style={{border:'1px solid rgba(201,168,76,0.2)',background:'rgba(45,27,78,0.3)'}}>
              <div className="px-4 py-2 border-b border-amber-800/20"><label className="font-cinzel text-amber-600/70 text-xs tracking-widest">YOUR QUESTION (Optional)</label></div>
              <input type="text" value={question} onChange={e=>setQuestion(e.target.value)} placeholder="What guidance do you seek from the cards?" className="w-full px-4 py-3 bg-transparent font-garamond text-amber-100/80 outline-none border-0"/>
            </div>
            <div className="flex justify-center mb-4">
              <label className="flex items-center gap-2 text-amber-300 text-sm cursor-pointer">
                <input type="checkbox" checked={useReversed} onChange={()=>setUseReversed(!useReversed)} className="accent-amber-600"/>
                Include reversed card meanings
              </label>
            </div>

            {drawnCards.length===0 ? (
              <div className="flex flex-col items-center gap-5 py-10">
                <p className="font-garamond text-amber-200/50 text-center italic">Breathe deeply. Clear your mind. When ready, draw your cards.</p>
                <div className="flex gap-2 my-2">
                  {Array.from({length:Math.min(selectedSpread.cardCount,7)}).map((_,i)=>(
                    <div key={i} className="rounded-xl card-back gold-border animate-float flex items-center justify-center text-amber-800/40 text-lg"
                      style={{width:50,height:78,background:'linear-gradient(135deg,#2d1b4e,#1a0a2e)',animationDelay:`${i*0.2}s`,border:'1px solid rgba(201,168,76,0.2)'}}>✦</div>
                  ))}
                </div>
                <button onClick={drawCards} disabled={isShuffling} className="relative px-8 py-4 rounded-xl font-cinzel text-base tracking-widest overflow-hidden transition-all"
                  style={{background:'linear-gradient(135deg,#6d28d9,#3b0764)',border:'1px solid rgba(201,168,76,0.5)',color:'#e8c97a'}}>
                  {isShuffling?<span className="animate-pulse">✦ Shuffling the 78 cards...</span>:<span>🃏 Draw {selectedSpread.cardCount} Card{selectedSpread.cardCount>1?'s':''}</span>}
                </button>
              </div>
            ) : (
              <>
                <div className="rounded-2xl p-4 md:p-6 mb-4 overflow-x-auto" style={{background:'rgba(26,10,46,0.6)',border:'1px solid rgba(201,168,76,0.15)'}}>
                  <SpreadLayout spread={selectedSpread} cards={drawnCards} reversedFlags={reversedFlags} onCardClick={(card,rev)=>setModalCard({card,rev})}/>
                </div>
                <div className="flex justify-center gap-3 mt-2 flex-wrap">
                  <button onClick={resetReading} className="border border-amber-700/50 px-4 py-2 rounded-full text-amber-300 text-sm font-cinzel hover:bg-amber-900/20">↺ Draw Again</button>
                  <button onClick={saveReading} className="border border-amber-600/50 px-5 py-2 rounded-full text-sm font-cinzel hover:bg-amber-900/20">💾 Save Reading</button>
                </div>
                <InterpretationPanel spread={selectedSpread} cards={drawnCards} question={question} reversedFlags={reversedFlags}/>
              </>
            )}
          </div>
        )}

        {/* GALLERY */}
        {view==='gallery' && (
          <div className="max-w-6xl mx-auto px-4 py-10">
            <div className="text-center mb-8">
              <h2 className="font-cinzel-deco text-2xl md:text-3xl text-amber-300">The 78 Tarot Cards</h2>
              <p className="font-garamond text-amber-500/60 italic">Tap any card to reveal its secrets</p>
            </div>
            <div className="flex justify-center gap-2 mb-8 flex-wrap">
              {[['all','All 78'],['major','Major Arcana'],['wands','Wands 🔥'],['cups','Cups 💧'],['swords','Swords ⚔️'],['pentacles','Pentacles 🌿']].map(([val,label])=>(
                <button key={val} onClick={()=>setGalleryFilter(val)} className={`font-cinzel text-xs px-4 py-2 rounded-full transition ${galleryFilter===val?'bg-amber-800/50 border border-amber-500/60 text-amber-300':'border border-amber-800/40 text-amber-600/60 hover:text-amber-400'}`}>{label}</button>
              ))}
            </div>
            <div className="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-10 gap-2 justify-items-center">
              {filteredCards.map(card=>(
                <div key={card.id} onClick={()=>setModalCard({card,rev:false})} className={`w-14 rounded-lg cursor-pointer transition-all duration-300 card-glow flex flex-col items-center justify-center py-2 ${suitClass(card.suit)}`}
                  style={{height:88,border:`1px solid ${suitColor(card.suit)}40`}}>
                  <span className="text-xl">{card.symbol}</span>
                  <span className="font-cinzel text-center leading-tight px-1 mt-1" style={{fontSize:'7px',color:`${suitColor(card.suit)}cc`}}>{card.name}</span>
                </div>
              ))}
            </div>
          </div>
        )}

        <footer className="border-t border-amber-800/20 mt-16 py-6 text-center">
          <p className="font-cinzel text-amber-800/40 text-xs tracking-widest">✦ THE TAROT ORACLE · 78 SACRED CARDS · ANCIENT WISDOM FOR MODERN SEEKERS ✦</p>
        </footer>
      </div>

      {modalCard && <CardModal card={modalCard.card} isReversed={modalCard.rev} onClose={()=>setModalCard(null)}/>}
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
